<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CoGM 舞台无立绘状态的交互原型。">
  <meta name="theme-color" content="#12140e">
  <title>无立绘时的舞台 · CoGM</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #12140e;
      --surface-low: #1a1c16;
      --surface-high: #282b23;
      --ink: #e2e3d8;
      --muted: #c6c7bb;
      --outline: #505449;
      --accent: #b4d087;
      --accent-ink: #223509;
      --radius-small: 8px;
      --radius-large: 24px;
      --gutter: clamp(12px, 3vw, 48px);
      font-family: system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--surface); color: var(--ink); }
    main {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      padding: 22px var(--gutter) var(--gutter);
    }
    h1, h2, h3, p, ul { margin: 0; }
    h1 { font-size: clamp(20px, 2.2vw, 26px); font-weight: 650; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-block-end: 16px;
    }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
    .modes {
      display: flex;
      padding: 3px;
      border: 1px solid var(--outline);
      border-radius: var(--radius-small);
      background: var(--surface-low);
    }
    .modes label { display: grid; position: relative; }
    .modes input { position: absolute; opacity: 0; }
    .modes span, .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-block-size: 44px;
      padding: 0 12px;
      border-radius: calc(var(--radius-small) - 2px);
      font-size: 14px;
      cursor: pointer;
    }
    .modes input:checked + span { background: var(--surface-high); color: var(--accent); }
    .modes input:focus-visible + span, .action input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .action { gap: 8px; padding-inline: 0; color: var(--muted); }
    .action input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); }
    .stage {
      position: relative;
      isolation: isolate;
      flex: 1;
      min-height: 500px;
      overflow: hidden;
      border: 1px solid var(--outline);
      border-radius: var(--radius-large);
      background: var(--surface-low);
    }
    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 56% center;
      z-index: -2;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(0deg, #12140ed9, transparent 29%, transparent 83%, #12140e80);
    }
    .location {
      position: absolute;
      inset: 24px auto auto 24px;
      padding: 10px 15px;
      border: 1px solid var(--outline);
      border-radius: var(--radius-small);
      background: color-mix(in srgb, var(--surface-low) 92%, transparent);
      font-size: 15px;
      font-weight: 600;
    }
    .foreground {
      position: absolute;
      inset: auto 24px 24px;
      display: grid;
      justify-items: center;
    }
    .cast {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 0;
      list-style: none;
    }
    .cast li {
      max-inline-size: min(100%, 20ch);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 6px 12px;
      border: 1px solid var(--outline);
      border-radius: var(--radius-small);
      background: var(--surface-low);
      color: var(--ink);
      font-size: 14px;
      line-height: 20px;
      font-weight: 550;
    }
    .dialogue-slot {
      width: min(100%, 620px);
    }
    .dialogue {
      margin-block-start: 12px;
      padding: 16px 20px 18px;
      border: 1px solid var(--outline);
      border-radius: 16px;
      background: var(--surface-low);
    }
    .speaker {
      display: inline-block;
      margin-block-end: 8px;
      padding: 4px 12px;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 14px;
      font-weight: 650;
    }
    .line { font-size: 17px; line-height: 1.65; }
    .old-cast {
      position: absolute;
      inset: auto 13% 17%;
      height: 62%;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      z-index: -1;
    }
    .old-cast > div {
      position: relative;
      display: grid;
      align-content: end;
      justify-items: center;
      gap: 6px;
      width: 43%;
      max-width: 290px;
      padding: 0 4px 12px;
      overflow: hidden;
      border-radius: 999px 999px 0 0;
      background: color-mix(in srgb, var(--surface) 79%, transparent);
    }
    .old-cast > div::before, .old-cast > div::after {
      content: "";
      position: absolute;
      inset: auto auto 44%;
      width: 28%;
      height: 29%;
      border-radius: 999px;
      background: #e2e3d81a;
    }
    .old-cast > div::after { inset: auto auto 0; width: 64%; height: 52%; border-radius: 999px 999px 0 0; }
    .old-cast strong { font-size: 24px; font-weight: 500; }
    .old-cast small { font-size: 12px; color: var(--muted); }
    @media (max-width: 600px) {
      main { padding-block-start: 14px; }
      .header { gap: 6px; margin-block-end: 10px; }
      .controls { column-gap: 14px; }
      .modes span { padding-inline: 9px; }
      .stage { min-height: 430px; border-radius: 16px; }
      .location { inset: 12px auto auto 12px; }
      .foreground { inset: auto 12px 12px; }
      .dialogue { padding: 12px; }
      .line { font-size: 16px; }
      .old-cast { inset-inline: 5%; }
      .old-cast > div { width: 46%; }
    }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <h1>无立绘时的舞台</h1>
      <div class="controls">
        <div class="modes" role="group" aria-label="无立绘展示方式">
          <label><input type="radio" name="mode" value="old"><span>现有占位</span></label>
          <label><input type="radio" name="mode" value="names"><span>常驻姓名牌</span></label>
          <label><input type="radio" name="mode" value="speech" checked><span>随发言显示</span></label>
        </div>
        <label class="action"><input id="speaking" type="checkbox" checked>由美发言</label>
      </div>
    </header>
    <section class="stage" aria-labelledby="location">
      <img class="scene-image" src="../../../apps/client/public/demo/scenes/boathouse-thumb.png" alt="">
      <h2 class="location" id="location">雨夜船屋</h2>
      <div class="old-cast" aria-label="在台人物" hidden>
        <div><strong>由</strong><small>立绘待上传</small></div>
        <div><strong>御</strong><small>立绘待上传</small></div>
      </div>
      <div class="foreground">
        <ul class="cast" aria-label="在台人物">
          <li id="yumi" title="由美">由美</li>
          <li title="御剑镜">御剑镜</li>
        </ul>
        <div class="dialogue-slot" aria-live="polite">
          <article class="dialogue" aria-labelledby="speaker" hidden>
            <h3 class="speaker" id="speaker">由美</h3>
            <p class="line">先别出门。你看，船上的绳子还在晃。</p>
          </article>
        </div>
      </div>
    </section>
  </main>
  <script>
    const modes = Array.from(document.querySelectorAll('input[name="mode"]'));
    const speaking = document.querySelector('#speaking');
    const oldCast = document.querySelector('.old-cast');
    const cast = document.querySelector('.cast');
    const yumi = document.querySelector('#yumi');
    const dialogue = document.querySelector('.dialogue');
    const params = new URLSearchParams(location.search);

    for (const mode of modes) {
      if (mode.value === params.get('mode')) mode.checked = true;
    }
    if (params.has('speaking')) speaking.checked = params.get('speaking') !== '0';

    function render() {
      const mode = modes.find((option) => option.checked).value;
      oldCast.hidden = mode !== 'old';
      cast.hidden = mode !== 'names';
      yumi.hidden = speaking.checked;
      dialogue.hidden = !speaking.checked;
    }

    document.querySelector('.controls').addEventListener('change', render);
    render();
  </script>
</body>
</html>
