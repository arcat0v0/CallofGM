<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物管理 · CoGM</title>
<style>
:root{
  --surface:#12140e;--surface-container-lowest:#0d0f09;--surface-container-low:#1a1c16;--surface-container:#1e2019;
  --surface-container-high:#292b23;--surface-container-highest:#33362e;--on-surface:#e2e3d8;--on-surface-variant:#c5c8b9;
  --outline:#8f9285;--outline-variant:#45483d;--primary:#b4d087;--on-primary:#223600;--primary-container:#374d13;
  --on-primary-container:#d0eda1;--secondary:#56d6f5;--tertiary:#bac3ff;--tertiary-container:#2f4090;--error:#ffb4a6;--warning:#f0c11c;
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:999px;
  --sans:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:96px;--drawer:400px;--row:40px;--thumb-w:24px;--thumb-h:32px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--surface-container-low);color:var(--on-surface);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-xs)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100vh;overflow:hidden}
.rail{background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:16px 0 20px;gap:4px;height:100vh}
.logo{width:40px;height:40px;border-radius:var(--r-full);background:var(--surface-container-high);display:grid;place-items:center;color:var(--primary);margin-bottom:20px}
.logo svg{width:22px;height:22px}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;width:80px;padding:4px 0 6px;color:var(--on-surface-variant);text-decoration:none;font-size:12px;border-radius:var(--r-sm)}
.nav a .pill{width:56px;height:32px;border-radius:var(--r-full);display:grid;place-items:center}
.nav a svg{width:24px;height:24px}
.nav a:hover .pill{background:var(--surface-container-high)}
.nav a[aria-current=page]{color:var(--on-surface)}
.nav a[aria-current=page] .pill{background:var(--primary-container);color:var(--on-primary-container)}
.me{width:40px;height:40px;border-radius:var(--r-full);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;font-weight:600;font-size:13px}
.logout{width:40px;height:40px;display:grid;place-items:center;color:var(--on-surface-variant);border-radius:var(--r-full);margin-top:6px}
.logout:hover{background:var(--surface-container-high)}
.logout svg{width:22px;height:22px}

.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0}

/* ---------- band: rule tabs ---------- */
.band{background:var(--surface);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 24px;border-bottom:1px solid var(--outline-variant)}
.band-l{display:flex;align-items:flex-end;gap:28px;min-width:0}
.band h1{font-size:12px;font-weight:400;color:var(--on-surface-variant);letter-spacing:.04em;padding:0 0 12px}
.tabs{display:flex;gap:4px}
.tab{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding:18px 16px 12px;text-align:left;color:var(--on-surface-variant);border-radius:var(--r-sm) var(--r-sm) 0 0}
.tab:first-child{margin-left:-16px}
.tab .t1{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.tab .short{font-size:1.375rem;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.tab .n{font-family:var(--mono);font-size:13px;color:var(--outline)}
.tab .full{font-size:12px;line-height:16px;height:16px;margin-top:4px;color:var(--on-surface-variant);white-space:nowrap;visibility:hidden}
.tab:hover{color:var(--on-surface);background:var(--surface-container-lowest)}
.tab[aria-selected=true]{color:var(--on-surface)}
.tab[aria-selected=true] .n{color:var(--on-surface-variant)}
.tab[aria-selected=true] .full{visibility:visible}
.tab[aria-selected=true]::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--primary)}
.band-r{display:flex;gap:8px;align-items:center;padding-bottom:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-size:13px;white-space:nowrap;color:var(--on-surface);border:1px solid var(--outline-variant)}
.btn:hover{background:var(--surface-container-high);border-color:var(--outline)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600;padding:0 16px 0 12px}
.btn.primary:hover{background:var(--on-primary-container);border-color:var(--on-primary-container)}
.btn.ghost{border-color:transparent;color:var(--on-surface-variant)}
.btn.ghost:hover{color:var(--on-surface);background:var(--surface-container-high)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.icon{width:36px;padding:0}
.btn.danger{color:var(--error)}
.btn.danger:hover{border-color:var(--error)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- query ---------- */
.query{padding:16px 24px 0;background:var(--surface-container-low)}
.qbar{display:flex;align-items:center;gap:6px;height:48px;padding:0 8px 0 14px;background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-sm);cursor:text}
.qbar:hover{border-color:var(--outline)}
.qbar:focus-within{border-color:var(--primary)}
.qbar>svg{color:var(--outline);margin-right:4px}
.tokens{display:flex;gap:6px;flex:none}
.tok{display:inline-flex;align-items:center;height:30px;padding:0 2px 0 9px;border-radius:var(--r-xs);background:var(--primary-container);color:var(--on-primary-container);white-space:nowrap;font-size:13px;animation:tokin .1s var(--ease)}
.tok .k{font-family:var(--mono);font-size:12px;color:var(--primary);margin-right:5px}
.tok button{width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r-xs);margin-left:3px;color:var(--primary)}
.tok button:hover{background:var(--on-primary);color:var(--on-primary-container)}
.tok button svg{width:14px;height:14px}
@keyframes tokin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.qbar input{flex:1;min-width:80px;height:100%;background:none;border:0;outline:0;font-size:14px;color:var(--on-surface)}
.qbar input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.qbar input::placeholder{color:var(--outline)}
.kbd{font-family:var(--mono);font-size:11px;min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;border:1px solid var(--outline-variant);border-radius:var(--r-xs);color:var(--on-surface-variant);line-height:1}
.qclear{height:30px;padding:0 10px;border-radius:var(--r-xs);color:var(--on-surface-variant);font-size:12px;white-space:nowrap}
.qclear:hover{background:var(--surface-container-high);color:var(--on-surface)}
.qbar .slash{margin-right:6px}
.qbar:focus-within .slash{display:none}

.facets{display:flex;align-items:center;height:40px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;font-size:12px}
.facets::-webkit-scrollbar{display:none}
.fg{display:flex;align-items:center;gap:2px;padding-right:12px;margin-right:12px;border-right:1px solid var(--outline-variant);height:16px}
.fg:last-child{border-right:0}
.fg .k{font-family:var(--mono);color:var(--outline);margin-right:4px}
.fo{display:inline-flex;align-items:baseline;gap:5px;height:26px;line-height:26px;padding:0 7px;border-radius:var(--r-xs);color:var(--on-surface-variant)}
.fo .c{font-family:var(--mono);font-size:11px;color:var(--outline)}
.fo:hover{background:var(--surface-container-high);color:var(--on-surface)}
.fo[data-zero]{opacity:.5}
.fo.hl{background:var(--surface-container-high);color:var(--on-surface);box-shadow:inset 0 0 0 1px var(--outline)}
.fo .ret{font-family:var(--mono);font-size:11px;color:var(--on-surface-variant)}
.fhint{color:var(--outline);font-size:12px}

/* ---------- work area ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) var(--drawer);min-height:0;border-top:1px solid var(--outline-variant)}
.work.closed{grid-template-columns:minmax(0,1fr) 0}
.results{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;min-width:0}
.rline{display:flex;align-items:center;justify-content:space-between;gap:16px;height:44px;padding:0 24px}
.count{display:flex;align-items:baseline;gap:6px;color:var(--on-surface-variant);white-space:nowrap}
.count b{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--on-surface)}
.count .of{font-family:var(--mono);font-size:13px}
.ctrls{display:flex;align-items:center;gap:16px}
.seg{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--outline)}
.seg .opts{display:inline-flex;padding:2px;border:1px solid var(--outline-variant);border-radius:var(--r-sm)}
.seg button{height:24px;padding:0 9px;border-radius:6px;color:var(--on-surface-variant);font-size:12px}
.seg button:hover{color:var(--on-surface)}
.seg button[aria-pressed=true]{background:var(--surface-container-highest);color:var(--on-surface)}

.batch{display:none;align-items:center;gap:6px;height:40px;padding:0 16px 0 24px;background:var(--surface-container-high);border-top:1px solid var(--outline-variant);box-shadow:inset 2px 0 0 var(--primary)}
.batch.on{display:flex}
.batch .sel{font-size:13px;margin-right:10px;white-space:nowrap}
.batch .sel b{font-family:var(--mono);font-weight:600}
.batch .note{color:var(--on-surface-variant);font-size:12px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batch .sp{flex:1}

.tablewrap{overflow:auto;min-height:0;overscroll-behavior:contain}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-container-low);height:32px;text-align:left;font-weight:400;font-size:12px;color:var(--on-surface-variant);border-top:1px solid var(--outline-variant);border-bottom:1px solid var(--outline-variant);padding:0 8px;white-space:nowrap}
thead th button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px;margin:0 -4px;border-radius:var(--r-xs);color:inherit}
thead th button:hover{color:var(--on-surface);background:var(--surface-container-high)}
thead th[aria-sort] button{color:var(--on-surface)}
thead th .ar{font-family:var(--mono);font-size:11px;width:10px}
th.r,td.r{text-align:right}
th.r button{margin-left:auto}
col.c-gut{width:40px}col.c-th{width:36px}col.c-kind{width:60px}col.c-own{width:128px}col.c-exp{width:52px}col.c-upd{width:100px}
tbody td{height:var(--row);border-bottom:1px solid var(--outline-variant);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tbody tr{cursor:default}
tbody tr:hover td{background:var(--surface-container)}
tbody tr.chk td{background:var(--surface-container)}
tbody tr.act td{background:var(--surface-container-high)}
tbody tr.act td:first-child{box-shadow:inset 2px 0 0 var(--primary)}
td.gut{padding:0 0 0 14px}
td.th{padding:0 4px}
td.last,th.last{padding-right:24px}
.cb{appearance:none;width:16px;height:16px;border:1.5px solid var(--outline);border-radius:3px;display:grid;place-items:center;opacity:0;cursor:pointer;background:var(--surface-container-lowest);vertical-align:middle}
.cb::after{content:"";width:8px;height:4px;border-left:2px solid var(--on-primary);border-bottom:2px solid var(--on-primary);transform:translateY(-1px) rotate(-45deg);opacity:0}
.cb:checked{background:var(--primary);border-color:var(--primary)}
.cb:checked::after{opacity:1}
tr:hover .cb,tr:focus-within .cb,.cb:checked,.cb:focus-visible,.multi .cb{opacity:1}
.nm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13.5px;font-weight:500;color:var(--on-surface)}
.kind{font-family:var(--mono);font-size:12px;color:var(--on-surface)}
.kind.npc{color:var(--on-surface-variant)}
.mods{color:var(--on-surface-variant)}
.mods .more{font-family:var(--mono);font-size:11px;color:var(--outline);margin-left:6px}
.nil{color:var(--outline)}
.own{color:var(--on-surface-variant)}
.own .pl{color:var(--tertiary)}
.own svg.i{width:12px;height:12px;vertical-align:-1px;margin-right:4px;color:var(--tertiary)}
.num{font-family:var(--mono);font-size:12px;color:var(--on-surface-variant)}
.upd{font-family:var(--mono);font-size:12px;color:var(--on-surface-variant)}
mark{background:none;color:var(--on-surface);text-decoration:underline;text-decoration-color:var(--primary);text-underline-offset:3px;text-decoration-thickness:2px}

/* thumb + monogram */
.thumb{width:var(--thumb-w);height:var(--thumb-h);border-radius:3px;overflow:hidden;display:grid;place-items:center;background:var(--surface-container-lowest);box-shadow:inset 0 0 0 1px var(--outline-variant)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.thumb .mg{font-size:11px;color:var(--on-surface-variant);line-height:1}

body.comfortable{--row:52px;--thumb-w:30px;--thumb-h:40px}
body.comfortable .nm{font-size:14px}
body.comfortable .thumb .mg{font-size:13px}

/* empty */
.empty{padding:56px 24px 24px;max-width:560px}
.empty h2{font-size:16px;font-weight:600;margin-bottom:6px}
.empty p{color:var(--on-surface-variant);margin-bottom:20px}
.relax{border-top:1px solid var(--outline-variant)}
.relax button{display:flex;align-items:center;gap:10px;width:100%;height:40px;border-bottom:1px solid var(--outline-variant);padding:0 8px;text-align:left;color:var(--on-surface-variant)}
.relax button:hover{background:var(--surface-container);color:var(--on-surface)}
.relax .op{font-family:var(--mono);font-size:12px;color:var(--outline);width:44px}
.relax .tg{color:var(--on-surface)}
.relax .tg .k{font-family:var(--mono);font-size:12px;color:var(--on-surface-variant);margin-right:4px}
.relax .rn{margin-left:auto;font-family:var(--mono);font-size:12px}

/* ---------- drawer ---------- */
.drawer{background:var(--surface-container);border-left:1px solid var(--outline-variant);overflow:auto;min-height:0;min-width:0}
.work.closed .drawer{display:none}
.dr-in{animation:drin .16s var(--ease)}
@keyframes drin{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}
.dhead{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 12px 0 24px;position:sticky;top:0;background:var(--surface-container);z-index:2}
.dhead .id{font-family:var(--mono);font-size:12px;color:var(--on-surface-variant)}
.dhead .nav2{display:flex;gap:2px}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--on-surface-variant)}
.ib:hover{background:var(--surface-container-high);color:var(--on-surface)}
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"p w" "p a";column-gap:18px;padding:4px 24px 22px}
.hero>.pframe{grid-area:p}.hero>.who{grid-area:w}.hero>.acts{grid-area:a;align-self:end}
.pframe{position:relative;width:150px;height:200px;border-radius:var(--r-xs);overflow:hidden;background:var(--surface-container-lowest)}
.pframe img{width:100%;height:100%;object-fit:cover;display:block}
.pframe.none{display:grid;place-items:center}
.pframe .bigmg{font-size:56px;font-weight:300;color:var(--surface-container-highest);line-height:1}
.pframe .ticks{position:absolute;inset:0;color:var(--outline-variant)}
.pframe .cap{position:absolute;left:10px;bottom:9px;font-family:var(--mono);font-size:11px;color:var(--on-surface-variant)}
.pframe.none{box-shadow:inset 0 0 0 1px var(--surface-container-high)}
.who{display:flex;flex-direction:column;min-width:0}
.who h2{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:.01em;word-break:break-word}
.idl{margin-top:6px;font-size:12px;color:var(--on-surface-variant);display:flex;flex-wrap:wrap;gap:4px 0}
.idl span+span::before{content:"·";margin:0 6px;color:var(--outline)}
.idl .pl{color:var(--tertiary)}
.ro{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;color:var(--tertiary)}
.ro svg{width:13px;height:13px}
.acts{display:flex;flex-direction:column;gap:8px;padding-top:16px}
.acts .row{display:flex;gap:8px}
.acts .row .btn{flex:1}
.acts .btn.icon{flex:none}

.sec{border-top:1px solid var(--outline-variant);padding:12px 24px 14px}
.sech{display:flex;align-items:center;justify-content:space-between;height:28px;margin-bottom:8px}
.sech h3{font-size:12px;font-weight:400;color:var(--on-surface-variant);display:flex;gap:8px;align-items:baseline}
.sech h3 .c{font-family:var(--mono);font-size:11px;color:var(--outline)}
.sech .src{font-family:var(--mono);font-size:11px;color:var(--outline)}
.mlist{list-style:none}
.mlist li{display:flex;align-items:center;justify-content:space-between;height:34px;border-bottom:1px solid var(--surface-container-high);font-size:13px}
.mlist li:last-child{border-bottom:0}
.mlist li .x{opacity:0}
.mlist li:hover .x,.mlist li .x:focus-visible{opacity:1}
.mlist .x{width:28px;height:28px}
.mlist .x svg{width:14px;height:14px}
.mnone{color:var(--outline);font-size:13px;height:34px;display:flex;align-items:center}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--outline-variant);border:1px solid var(--outline-variant);border-radius:var(--r-sm);overflow:hidden}
.sum>div{background:var(--surface-container);padding:9px 12px 10px;min-width:0}
.sum dt{font-size:11px;color:var(--on-surface-variant);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum dd{font-size:15px;font-weight:500;color:var(--on-surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exl{display:flex;flex-wrap:wrap;gap:0;font-size:13px;color:var(--on-surface)}
.exl span{padding:0 10px;border-left:1px solid var(--outline-variant);line-height:16px}
.exl span:first-child{padding-left:0;border-left:0}
.meta{padding:14px 24px 20px;border-top:1px solid var(--outline-variant);font-family:var(--mono);font-size:12px;color:var(--on-surface-variant);display:flex;justify-content:space-between}
.meta .rel{color:var(--outline)}

/* ---------- menus, dialog, toast ---------- */
.menu{position:fixed;z-index:50;min-width:220px;max-width:280px;background:var(--surface-container-highest);border:1px solid var(--outline-variant);border-radius:var(--r-md);padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.menu[hidden]{display:none}
.menu .mh{font-size:11px;color:var(--on-surface-variant);padding:6px 10px 6px;font-family:var(--mono)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:var(--r-sm);text-align:left;font-size:13px;color:var(--on-surface)}
.menu button:hover,.menu button:focus-visible{background:var(--surface-container-high);outline:0}
.menu button .ck{width:14px;color:var(--primary);flex:none}
.menu button .ck svg.i{width:14px;height:14px;stroke-width:2}
.menu button .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--on-surface-variant)}
.menu button.danger{color:var(--error)}
.menu hr{border:0;border-top:1px solid var(--outline-variant);margin:6px 4px}
dialog{margin:auto;background:var(--surface-container-high);color:var(--on-surface);border:1px solid var(--outline-variant);border-radius:var(--r-lg);padding:24px;width:min(400px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(8,9,6,.66)}
dialog h2{font-size:16px;font-weight:600;margin-bottom:8px}
dialog p{color:var(--on-surface-variant);margin-bottom:22px}
dialog .row{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:calc(var(--rail) + (100vw - var(--rail)) / 2);bottom:24px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;background:var(--surface-container-highest);border:1px solid var(--outline-variant);color:var(--on-surface);border-radius:var(--r-sm);padding:0 6px 0 14px;height:40px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap}
.toast[hidden]{display:none}
.toast button{height:28px;padding:0 10px;border-radius:var(--r-xs);color:var(--primary);font-size:12px}
.toast button:hover{background:var(--surface-container-high)}

/* mobile-only parts hidden on desktop */
.mlistv,.mback,.msort{display:none}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .app{display:block;height:auto;overflow:visible}
  .rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);height:auto;z-index:20;padding-top:12px;gap:2px}
  .logo{margin-bottom:12px}
  .nav{gap:2px}
  .main{display:block;margin-left:var(--rail)}
  .band{flex-direction:column;align-items:stretch;gap:0;padding:0 14px}
  .band h1{padding:14px 0 0}
  .band-l{flex-direction:column;align-items:stretch;gap:0}
  .tab{padding:8px 10px 10px}
  .tab:first-child{margin-left:-10px}
  .tab .short{font-size:1.125rem}
  .tab .n{font-size:12px}
  .tab[aria-selected=true]::after{left:10px;right:10px}
  .band-r{order:3;padding:12px 0}
  .band-r .rname{display:none}
  .band-r .btn{flex:1}
  .tab .full{display:block;font-size:11px;margin-top:2px;height:14px;line-height:14px}
  .band-r .btn{height:32px;padding:0 10px}
  .band-r .btn.primary{padding:0 12px 0 8px}
  .query{position:sticky;top:0;z-index:10;padding:10px 12px 0;border-bottom:1px solid var(--outline-variant)}
  .qbar{height:44px;padding:0 6px 0 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .qbar::-webkit-scrollbar{display:none}
  .qbar .slash{display:none}
  .tok{height:28px;font-size:12px}
  .qbar input{min-width:90px;font-size:14px}
  .facets{height:38px;margin:0 -12px;padding:0 12px}
  .work,.work.closed{display:block;border-top:0}
  .rline{height:44px;padding:0 12px}
  .ctrls .seg.dens{display:none}
  .ctrls .seg .lb{display:none}
  .batch{display:none!important}
  .tablewrap{overflow:visible}
  .tablewrap table{display:none}
  .mlistv{display:block;list-style:none;border-top:1px solid var(--outline-variant)}
  .mlistv li button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;width:100%;min-height:58px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--outline-variant)}
  .mlistv li button:active{background:var(--surface-container)}
  .mlistv .thumb{grid-row:1/3;--thumb-w:30px;--thumb-h:40px}
  .mlistv .nm{font-size:14px}
  .mlistv .l2{grid-column:2/4;font-size:12px;color:var(--on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .mlistv .l2 .pl{color:var(--tertiary)}
  .mlistv .upd{font-size:11px;grid-row:1;grid-column:3}
  .empty{padding:32px 12px}
  .drawer{display:none;border-left:0;overflow:visible}
  body.mdetail .band,body.mdetail .query,body.mdetail .results{display:none}
  body.mdetail .drawer{display:block!important}
  .mback{display:flex;align-items:center;gap:6px;height:52px;padding:0 12px 0 8px;border-bottom:1px solid var(--outline-variant);background:var(--surface);position:sticky;top:0;z-index:5}
  .mback button.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 6px;border-radius:var(--r-sm);font-size:13px;color:var(--on-surface)}
  .mback .pos{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--on-surface-variant)}
  .dhead{display:none}
  .hero{grid-template-columns:112px minmax(0,1fr);gap:14px;padding:18px 14px 18px}
  .pframe{width:112px;height:150px}
  .pframe .bigmg{font-size:42px}
  .who h2{font-size:18px}
  .hero{grid-template-areas:"p w" "a a";grid-template-rows:auto auto}
  .acts{padding-top:14px;flex-direction:row}
  .acts>.btn{flex:1}
  .acts .row{flex:1}
  .sec{padding:12px 14px 16px}
  .mlist li .x{opacity:1}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .meta{padding:14px 14px 32px;flex-direction:column;gap:4px}
  .toast{left:calc(var(--rail) + (100vw - var(--rail)) / 2);max-width:calc(100vw - var(--rail) - 24px)}
}
.band-r .rname{display:none}
.rname{font-size:12px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto;min-width:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    let list = opts[key].filter((o) => !active || o.v !== active.value);

const menu = $("#menu");
let menuAnchor = null;
function openMenu(anchor, html, onClick) {
  menu.innerHTML = html;
  menu.hidden = false;
  menuAnchor = anchor;
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = r.left + mw > innerWidth - 8 ? r.right - mw : r.left;
  left = Math.max(8, Math.min(left, innerWidth - mw - 8));
  let top = r.bottom + 6;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  menu.style.left = left + "px";
  menu.style.top = top + "px";
  menu.onclick = (e) => { const b = e.target.closest("button"); if (b) onClick(b); };
  const first = menu.querySelector("button");
  first && first.focus();
}
function closeMenu() { if (!menu.hidden) { menu.hidden = true; menuAnchor && menuAnchor.focus && menuAnchor.focus({ preventScroll: true }); menuAnchor = null; } }

  else if (a === "link") linkMenu(b, c);
  else if (a === "more") openMenu(b, `<button data-m="copy">复制人物 ID<span class="c">${c.id}</span></button><hr><button class="danger" data-m="del">删除人物…</button>`, (x) => {
    closeMenu();
    if (x.dataset.m === "del") confirmDel([c.id]);
    else toast(`已复制 · ${c.id}`);
  });
});
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG" || !img.dataset.mg) return;
  failed.add(img.getAttribute("src"));
  if (img.dataset.big) { renderDrawer(false); return; }
  const s = document.createElement("span");
  s.className = "mg"; s.setAttribute("aria-hidden", "true"); s.textContent = img.dataset.mg;
  img.replaceWith(s);
}, true);
document.addEventListener("keydown", (e) => {
  if ($("#dlg").open) return;
  const inQ = document.activeElement === qi;
  const inField = !inQ && /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape") {
    if (!menu.hidden) { closeMenu(); return; }
    if (S.mdetail) { setMDetail(false); return; }
    if (S.checked.size) { S.checked.clear(); renderSel(); return; }
    if (inQ) { qi.blur(); return; }
    return;
  }
  if (!menu.hidden) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const bs = [...menu.querySelectorAll("button")];
      const i = bs.indexOf(document.activeElement);
      bs[(i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus();
    }
    return;
  }
  if (e.key === "/" && !inQ && !inField) { e.preventDefault(); qi.focus(); qi.select(); return; }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !inField && !S.mdetail) {
    e.preventDefault();
    if (inQ && !S.arrowed) { S.arrowed = true; renderFacets(); }
    step(e.key === "ArrowDown" ? 1 : -1);
    return;
  }
  if (e.key === "Enter" && !inQ && !inField && document.activeElement === document.body) {
    const c = byId(activeId()); if (c) openSheet(c);
  }
});
mq.addEventListener("change", () => { if (!mq.matches) setMDetail(false); render(); });

/* ---------- hash hooks ---------- */
function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  const sel = (h.get("sel") || "").split(",").filter(Boolean).filter(byId);
  let r = h.get("rule");
  if (!r && sel.length) r = byId(sel[0]).ruleId;
  if (r && RULES.find((x) => x.id === r)) S.rule = r;
  S.tokens = [];
  if (h.get("kind")) S.tokens.push({ key: "kind", value: h.get("kind").toUpperCase() });
  if (h.get("own")) S.tokens.push({ key: "own", value: h.get("own") });
  if (h.get("mod")) S.tokens.push({ key: "mod", value: h.get("mod") === "未归入" || h.get("mod") === "none" ? "__none" : h.get("mod") });
  S.q = h.get("q") || "";
  qi.value = S.q;
  const v = h.get("view");
  if (v === "comfortable" || v === "compact") S.density = v;
  const so = h.get("sort");
  if (so) S.sort = { key: so, dir: so === "updated" || so === "exp" ? -1 : 1 };
  S.drawer = h.get("drawer") !== "closed";
  S.checked.clear();
  if (sel.length) {
    S.active[S.rule] = sel[0];
    if (sel.length > 1) sel.forEach((id) => S.checked.add(id));
  }
  render();
  if (sel.length) { const tr = document.querySelector(`#tbody tr[data-id="${sel[0]}"]`); const w = $("#tablewrap"); if (tr && !mq.matches) w.scrollTop = tr.offsetTop - w.clientHeight / 2 + tr.offsetHeight; }
  setMDetail(h.get("m") === "detail" && mq.matches);
  if (h.get("focus") === "q") qi.focus();
}
addEventListener("hashchange", applyHash);
applyHash();
</script>
