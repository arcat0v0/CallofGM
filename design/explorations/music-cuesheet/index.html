<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐 · 提示单</title>
<link rel="stylesheet" href="../_shared/base.css">
<style>
/* —— 提示单 v2：台账 + 分段标尺 + 贴边试听条。强调色只给“正在发声”与唯一主操作 —— */
:root{--edge:28px;--rule:color-mix(in oklab,var(--outline-var) 70%,transparent);--rule-soft:color-mix(in oklab,var(--outline-var) 40%,transparent);--dim:#a9ac9e}
.mods{width:272px;flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.mods h2{font-size:12px;letter-spacing:.14em;color:var(--dim);font-weight:500;padding:26px 20px 10px}
.mods .field{margin:0 14px 10px;height:36px;font-size:13px}
.mlist{flex:1;overflow:auto;padding:0 8px 16px}
.mi{width:100%;display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;border-radius:12px;color:var(--on-var);position:relative;text-align:left}
.mi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .ct{font-size:12px;color:var(--dim)}
.mi:hover{background:color-mix(in oklab,var(--on) 6%,transparent)}
.mi[aria-current=true]{background:var(--c-high);color:var(--on)}
.mi[aria-current=true]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--outline)}
.mi[aria-current=true] .ct{color:var(--on)}
.mi.all{margin-bottom:6px}
.msep{height:1px;background:var(--rule);margin:6px 12px 8px}
.sheet{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.head{padding:24px var(--edge) 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:center}
.head h1{font-size:28px;line-height:1.2;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .stats{grid-column:1/-1;margin-top:2px;color:var(--on-var);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.head .stats i{opacity:.4;font-style:normal}
.toolswrap{min-height:64px}
.tools{display:flex;align-items:center;gap:10px;padding:10px var(--edge) 14px;flex-wrap:wrap}
.tools .field{flex:1;min-width:180px;max-width:380px}
.tools .sort{margin-left:auto}
.bulk{display:flex;align-items:center;gap:10px;padding:0 20px 0 8px;margin:10px var(--edge) 14px;height:48px;border-radius:24px;background:var(--c-highest);color:var(--on);font-weight:500}
.bulk .sp{flex:1}
.bulk .btn{height:34px;background:color-mix(in oklab,var(--on) 10%,transparent)}
.ledger{flex:1;overflow:auto;padding:0 var(--edge) 96px;min-height:0;position:relative}
.cols{display:grid;align-items:center;column-gap:12px;grid-template-columns:22px 26px 36px minmax(0,1fr) 72px 40px}
.row .r{text-align:right}
.sec{display:flex;align-items:center;gap:10px;height:34px;margin-top:22px;font-size:12px;color:var(--on-var);border-bottom:1px solid var(--outline)}
.sec:first-child{margin-top:6px}
.sec b{font-family:var(--mono);font-weight:700;color:var(--on);font-size:13px;letter-spacing:.14em}
.sec .n{font-family:var(--mono);font-size:13px}
.sec .l{flex:1}
.sec .hint{font-family:var(--mono);font-size:12px;color:var(--on-var);letter-spacing:.02em}
.row{height:56px;border-bottom:1px solid var(--rule-soft);position:relative;border-bottom-color:color-mix(in oklab,var(--outline-var) 32%,transparent)}
.row:hover{background:color-mix(in oklab,var(--on) 4%,transparent)}
.row .chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--outline);display:grid;place-items:center;opacity:0;color:transparent}
.row:hover .chk,.row:focus-within .chk,.ledger.selecting .chk{opacity:1}
.row .chk[aria-checked=true]{background:var(--on);border-color:var(--on);color:var(--surface);opacity:1}
.row .no{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.play{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:color-mix(in oklab,var(--on) 62%,transparent);border:1.5px solid transparent}
.row:hover .play,.play:focus-visible{border-color:var(--outline);color:var(--on);background:color-mix(in oklab,var(--on) 8%,transparent)}
.row.on .play{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.row.on .no{color:var(--primary)}
.ttl{min-width:0}
.ttl b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .m-only,.dock .meta .tm{display:none}
.ttl span{display:block;font-size:12.5px;color:var(--on-var);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dur{font-size:13px;color:var(--on-var);font-family:var(--mono);font-variant-numeric:tabular-nums}
.row .more{color:var(--on-var);opacity:0}
.row:hover .more,.row:focus-within .more,.row.on .more{opacity:1}
.seg.neutral button[aria-pressed=true]{background:var(--c-highest);color:var(--on)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.prog i{display:block;height:100%;background:var(--primary);width:0}
.ledger.drag::after{content:"松开即可上传到「" attr(data-mod) "」";position:absolute;inset:8px var(--edge) 96px;border:2px dashed var(--primary);border-radius:20px;background:color-mix(in oklab,var(--surface) 82%,transparent);display:grid;place-items:center;color:var(--primary);font-size:16px;z-index:5}
/* 试听条：贴边通栏，列与台账对齐（播放键对播放列，标题对曲目列，总时长对时长列） */
.dock{display:none;align-items:center;column-gap:12px;height:64px;padding:0 var(--edge) 0 calc(var(--edge) + 72px);border-top:1px solid var(--outline-var);background:var(--c-low);position:relative;grid-template-columns:36px minmax(140px,230px) minmax(0,1fr) 72px 40px;margin-right:0}
.dock.on{display:grid}
.dock .pp{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.dock .meta{min-width:0}
.dock .meta b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .meta span{font-family:var(--mono);font-size:12px;color:var(--on-var);white-space:nowrap}
.dock .scrub{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--on-var);font-family:var(--mono);min-width:0}
.dock .bar{flex:1;height:4px;border-radius:2px;background:color-mix(in oklab,var(--on) 18%,transparent);position:relative}
.dock .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--primary)}
.dock .bar u{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--primary);transform:translate(-50%,-50%)}
.dock .tt{font-family:var(--mono);font-size:13px;text-align:right;color:var(--on-var)}
/* 空状态：一张空白的提示单，整块就是投放区 */
.blank{border:1.5px dashed var(--outline-var);border-radius:16px;padding:0 20px 18px;margin-top:6px}
.ledger.dragover .blank{border-color:var(--primary)}
.blank .sec:first-child{margin-top:0}
.blank .sec{border-bottom-color:var(--outline-var)}
.blank .slot{height:48px;border-bottom:1px solid color-mix(in oklab,var(--outline-var) 32%,transparent);display:grid;grid-template-columns:22px 26px 36px minmax(0,1fr) 72px 40px;column-gap:12px;align-items:center;color:color-mix(in oklab,var(--on) 30%,transparent);font-family:var(--mono);font-size:12px}
.blank .slot .no{text-align:right;grid-column:2}
.blank .slot .dur{grid-column:5;text-align:right}
.emptyrow{padding:20px 0 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.emptyrow h3{font-size:18px;font-weight:500}
.emptyrow p{color:var(--on-var);max-width:50ch}
.emptyrow .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
/* 添加对话框 */
.dlg{width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--c);border-radius:28px;display:flex;flex-direction:column}
.dlg header{display:flex;align-items:center;padding:20px 20px 4px 28px;gap:8px}
.dlg header h2{flex:1;font-size:20px;font-weight:500}
.dlg header .sub{display:block;font-size:13px;color:var(--on-var);font-weight:400}
.tabs{display:flex;gap:4px;padding:8px 20px 0;border-bottom:1px solid var(--outline-var)}
.tabs button{height:44px;padding:0 12px;color:var(--on-var);position:relative}
.tabs button[aria-selected=true]{color:var(--primary)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:2px 2px 0 0;background:var(--primary)}
.dlg .body{padding:20px 28px;display:flex;flex-direction:column;gap:14px}
.drop{border:1.5px dashed var(--outline);border-radius:20px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.drop b{font-weight:500}.drop span{color:var(--on-var);font-size:13px}
.q{display:flex;flex-direction:column}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto 52px 36px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
.qi .nm{min-width:0;background:none;border:0;border-bottom:1px solid transparent;height:32px;outline:0}
.qi .nm:focus{border-color:var(--primary)}
.qi .st{font-size:12px;color:var(--on-var);text-align:right}.qi .st.ok{color:var(--primary)}
.seg.sm button{height:26px;padding:0 10px;font-size:12px}.seg.sm{padding:2px}
.dlg footer{display:flex;align-items:center;gap:8px;padding:12px 20px 20px 28px}
.dlg footer .hint{flex:1;font-size:12.5px;color:var(--on-var)}
.menu{position:fixed;min-width:200px;background:var(--c-highest);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:40;display:none}
.menu.on{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;height:40px;padding:0 12px;border-radius:10px;text-align:left}
.menu button:hover{background:color-mix(in oklab,var(--on) 8%,transparent)}
.menu .danger{color:var(--error)}
.menu hr{border:0;height:1px;background:var(--outline-var);margin:4px 6px}
.picker{display:none}
@media (max-width:760px){
  :root{--edge:14px}
  .mods{display:none}
  .picker{display:flex;align-items:center;gap:8px;margin:14px var(--edge) 0;height:44px;padding:0 14px;border-radius:14px;background:var(--c);border:1px solid var(--outline-var);width:calc(100% - 28px);text-align:left}
  .picker b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .picker .ct{color:var(--on-var);font-size:12px}
  .head{padding:14px var(--edge) 6px}
  .head h1{font-size:22px}
  .head .btn{height:40px;padding:0 14px}.head .btn .lbl{display:none}
  .tools{padding:8px var(--edge) 6px}
  .tools .field{min-width:0;flex-basis:100%;max-width:none}
  .seg button{height:40px}
  .toolswrap{min-height:112px}
  .tools .sort{display:none}
  .seg button{padding:0 11px}
  .ledger{padding-bottom:104px}
  .cols{grid-template-columns:20px 40px minmax(0,1fr) 44px;column-gap:6px}
  .cols .chk,.cols .dur{display:none}
  .row{height:60px}
  .row .play{border-color:color-mix(in oklab,var(--on) 28%,transparent);width:40px;height:40px;color:var(--on)}
  .row .more{width:44px;height:48px;border-radius:12px;opacity:1}
  .ttl b{font-size:14.5px}
  .ttl .m-only{display:inline;font-family:var(--mono);color:var(--on-var)}
  .dock{height:auto;grid-template-columns:36px minmax(0,1fr) 44px;grid-template-areas:"pp title stop";gap:0 12px;padding:10px 6px 12px var(--edge)}
  .dock::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--primary);width:var(--p,0%)}
  .dock .pp{grid-area:pp;align-self:center}
  .dock .meta{grid-area:title;align-self:center}
  .dock #stop{grid-area:stop;align-self:center}
  .dock .scrub,.dock .vol,.dock .tt{display:none}
  .dock .meta .kind{display:none}
  .dock .meta .tm{display:block}
  .blank{padding:0 12px 14px}
  .blank .slot,.row.cols{grid-template-columns:20px 40px minmax(0,1fr) 44px}
  .blank .slot .no{grid-column:1}
  .tools>.btn.tonal:not(.sm){flex:1 1 calc(50% - 5px);justify-content:center}
  .tools>.btn.tonal:not(.sm):first-child{flex-basis:100%}
  .emptyrow{padding-top:14px}
  .bulk{margin:8px var(--edge) 8px;padding:0 12px 0 4px}
  .bulk .btn .lbl{display:none}
}
</style>
</head>
<body>
<div class="app">
  <script src="../_shared/data.js"></script>
  <script>document.write(railHTML())</script>
  <main class="surface">
    <aside class="mods" aria-label="模组">
      <h2>模组</h2>
      <label class="field"><span id="ms"></span><input id="mq" type="search" placeholder="找模组" aria-label="找模组"></label>
      <div class="mlist" id="mlist"></div>
    </aside>
    <section class="sheet">
      <button class="picker" id="picker" aria-haspopup="listbox"></button>
      <div class="head" id="head"></div>
      <div id="toolsHost"></div>
      <div class="ledger" id="ledger"></div>
      <div class="dock" id="dock" role="region" aria-label="正在试听"></div>
    </section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="menu" id="menu" role="menu"></div>
<script>
const S={mod:"雾港疑案",type:"all",q:"",sort:"added",play:null,prog:0,sel:new Set(),mq:""};
const $=(id)=>document.getElementById(id);
const st=new URLSearchParams(location.search).get("state")||"";
if(st==="empty")S.mod="无名小镇";
if(st==="all")S.mod="*";
const inMod=()=>TRACKS.filter(t=>S.mod==="*"||t.m===S.mod);
const view=()=>{let a=inMod();if(S.type!=="all")a=a.filter(t=>t.type===S.type);if(S.q)a=a.filter(t=>(t.name+(t.artists||"")+(t.album||"")).toLowerCase().includes(S.q.toLowerCase()));
  if(S.sort==="name")a=[...a].sort((x,y)=>x.name.localeCompare(y.name,"zh"));if(S.sort==="dur")a=[...a].sort((x,y)=>y.dur-x.dur);return a;};
const subline=(t,all)=>{const parts=[];if(all)parts.push(t.m);if(t.src!=="upload"){if(t.artists)parts.push(t.artists);if(t.album)parts.push(t.album);parts.push(SRC[t.src])}return parts.join(" · ")};
function renderMods(){
  const cnt=(m)=>TRACKS.filter(t=>t.m===m).length;
  const q=S.mq.trim();const ms=MODULES.filter(m=>!q||m.includes(q));
  $("ms").innerHTML=ic("search",16);
  $("mlist").innerHTML=`<button class="mi all" aria-current="${S.mod==="*"}" data-m="*"><span class="nm">全部曲目</span><span class="ct num">${TRACKS.length}</span></button><div class="msep"></div>`+
   ms.map(m=>`<button class="mi" aria-current="${S.mod===m}" data-m="${m}"><span class="nm">${m}</span><span class="ct num">${cnt(m)}</span></button>`).join("");
  $("picker").innerHTML=`<span style="color:var(--dim);font-size:12px;letter-spacing:.1em">模组</span><b>${S.mod==="*"?"全部曲目":S.mod}</b><span class="ct num">${inMod().length}</span>${ic("chevs",16)}`;
}
function renderHead(){
  const a=inMod();const tot=a.reduce((x,t)=>x+t.dur,0);
  const h=Math.floor(tot/3600),mn=Math.floor(tot%3600/60);
  $("head").innerHTML=`<h1>${S.mod==="*"?"全部曲目":S.mod}</h1>${S.mod!=="*"?`<button class="btn fill" id="add">${ic("plus",18)}<span class="lbl">添加曲目</span></button>`:""}
   <div class="stats"><span>${a.length} 首</span>${a.length?`<i>·</i><span>${h?h+" 小时 ":""}${mn} 分</span>`:""}</div>`;
}
function renderTools(){
  const a=inMod();
  if(S.sel.size){
    $("toolsHost").innerHTML=`<div class="toolswrap"><div class="bulk"><button class="iconbtn" id="clr" aria-label="取消选择">${ic("x")}</button><span class="num">已选 ${S.sel.size} 首</span><span class="sp"></span>
     <button class="btn sm" data-b="bgm">${ic("repeat",16)}<span class="lbl">设为 BGM</span></button><button class="btn sm" data-b="se">${ic("zap",16)}<span class="lbl">设为 SE</span></button><button class="btn sm" style="color:var(--error)" data-b="del">${ic("trash",16)}<span class="lbl">删除</span></button></div></div>`;return;
  }
  if(!a.length){$("toolsHost").innerHTML=`<div class="toolswrap"><div class="tools"><button class="btn tonal" data-open="upload">${ic("upload",18)}上传文件</button><button class="btn tonal" data-open="search">${ic("search",18)}搜索平台</button><button class="btn tonal" data-open="list">${ic("list",18)}导入歌单</button></div></div>`;return}
  $("toolsHost").innerHTML=`<div class="toolswrap">${a.length?`<div class="tools"><label class="field">${ic("search",16)}<input id="q" type="search" value="${S.q}" placeholder="搜索曲名、艺术家" aria-label="搜索曲目"></label>
   <div class="seg neutral" role="group" aria-label="类型">${[["all","全部"],["bgm","BGM"],["se","SE"]].map(([k,l])=>`<button aria-pressed="${S.type===k}" data-t="${k}">${l}</button>`).join("")}</div>
   <button class="btn tonal sm sort" id="sort">${ic("sliders",16)}${{added:"最近添加",name:"按名称",dur:"按时长"}[S.sort]}</button></div>`:""}</div>`;
}
function rowHTML(t,i,all){
  const on=S.play===t.id;const sub=subline(t,all);
  return `<div class="row cols${on?" on":""}" data-id="${t.id}"><button class="chk" role="checkbox" aria-checked="${S.sel.has(t.id)}" aria-label="选择 ${t.name}" data-chk="${t.id}">${ic("check",13)}</button>
   <span class="no">${String(i+1).padStart(2,"0")}</span>
   <button class="play" data-play="${t.id}" aria-label="${on?"暂停":"试听"} ${t.name}">${ic(on?"pause":"play",16)}</button>
   <div class="ttl"><b>${t.name}</b><span><span class="d m-only">${mmss(t.dur)}${sub?" · ":""}</span>${sub}</span></div>
   <span class="dur r">${mmss(t.dur)}</span>
   <button class="iconbtn more" data-more="${t.id}" aria-label="${t.name} 的更多操作">${ic("more")}</button>${on?`<div class="prog"><i style="width:${S.prog*100}%"></i></div>`:""}</div>`;
}
function renderLedger(){
  const L=$("ledger");const a=view();const all=S.mod==="*";
  L.className="ledger"+(all?" all":"")+(S.sel.size?" selecting":"");L.dataset.mod=all?"":S.mod;
  const secHead=(label,n,hint)=>`<div class="sec"><b>${label}</b><span class="n">${n}</span><span class="l"></span><span class="hint">${hint}</span></div>`;
  if(!inMod().length){
    const slots=(k)=>[1,2].map(i=>`<div class="slot"><span class="no">0${i}</span><span class="dur">--:--</span></div>`).join("");
    L.innerHTML=`<div class="blank">`+secHead("BGM",0,"循环 · 一次只放一首")+slots()+secHead("SE",0,"点一下播一次")+slots()+`</div>
     <div class="emptyrow"><h3>这个模组还没有曲目</h3><p>把音频文件拖到这里就能开始；也可以从网易云音乐、QQ 音乐按歌曲或歌单添加。</p></div>`;return;
  }
  if(!a.length){L.innerHTML=`<div class="emptyrow"><h3>没有符合的曲目</h3><p>换个关键词，或者清掉类型筛选。</p><div class="acts"><button class="btn text" id="reset" style="padding:0">清除筛选</button></div></div>`;return;}
  const bg=a.filter(t=>t.type==="bgm"),se=a.filter(t=>t.type==="se");
  const sec=(label,list,hint)=>list.length?secHead(label,list.length,hint)+list.map((t,i)=>rowHTML(t,i,all)).join(""):"";
  L.innerHTML=sec("BGM",bg,"循环 · 一次只放一首")+sec("SE",se,"点一下播一次");
}
function renderDock(){
  const t=TRACKS.find(x=>x.id===S.play);const d=$("dock");if(!t){d.className="dock";return}
  d.className="dock on";d.style.setProperty("--p",S.prog*100+"%");
  d.innerHTML=`<button class="pp" id="pp" aria-label="暂停">${ic("pause",18)}</button><div class="meta"><b>${t.name}</b><span class="kind">${t.type==="bgm"?"BGM · 循环试听":"SE · 播放一次"}</span><span class="tm" id="tm">${mmss(Math.floor(t.dur*S.prog))} / ${mmss(t.dur)}</span></div>
   <div class="scrub"><span id="el">${mmss(Math.floor(t.dur*S.prog))}</span><div class="bar" id="bar"><i style="width:${S.prog*100}%"></i><u style="left:${S.prog*100}%"></u></div></div><span class="tt">${mmss(t.dur)}</span>
   <button class="iconbtn" id="stop" aria-label="停止试听">${ic("x")}</button>`;
}
function renderAll(){renderMods();renderHead();renderTools();renderLedger();renderDock();}
let timer=null;
function play(id,start){S.play=id;S.prog=start||0;clearInterval(timer);const t=TRACKS.find(x=>x.id===id);
  timer=setInterval(()=>{S.prog+=0.25/Math.min(t.dur,40);if(S.prog>=1){S.prog=t.type==="bgm"?0:1;if(t.type==="se"){stop();return}}tick()},250);renderAll()}
function tick(){const r=document.querySelector(".row.on .prog i");if(r)r.style.width=S.prog*100+"%";const t=TRACKS.find(x=>x.id===S.play);if(!t)return;
  const bi=document.querySelector("#bar i"),bu=document.querySelector("#bar u"),el=$("el"),tm=$("tm");
  $("dock").style.setProperty("--p",S.prog*100+"%");
  if(bi){bi.style.width=S.prog*100+"%";bu.style.left=S.prog*100+"%";el.textContent=mmss(Math.floor(t.dur*S.prog))}
  if(tm)tm.textContent=mmss(Math.floor(t.dur*S.prog))+" / "+mmss(t.dur)}
function stop(){clearInterval(timer);S.play=null;renderAll()}
document.addEventListener("click",(e)=>{
  const c=(s)=>e.target.closest(s);let x;
  if(!c("#menu")&&!c("[data-more]"))$("menu").className="menu";
  if(x=c("[data-m]")){S.mod=x.dataset.m;S.q="";S.type="all";S.sel.clear();renderAll()}
  else if(x=c("[data-t]")){S.type=x.dataset.t;renderAll()}
  else if(x=c("[data-play]")){const id=+x.dataset.play;if(S.play===id)stop();else play(id)}
  else if(c("#pp")||c("#stop"))stop();
  else if(x=c("[data-chk]")){const id=+x.dataset.chk;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);renderAll()}
  else if(c("#clr")){S.sel.clear();renderAll()}
  else if(c("#sort")){S.sort=S.sort==="added"?"name":S.sort==="name"?"dur":"added";renderAll()}
  else if(c("#reset")){S.q="";S.type="all";renderAll()}
  else if(c("#add")||(x=c("[data-open]")))openDlg(x?x.dataset.open:"upload");
  else if(c("#closeDlg")||e.target.id==="scrim")$("scrim").className="scrim";
  else if(x=c("[data-tab]"))openDlg(x.dataset.tab);
  else if(x=c("[data-more]")){const r=x.getBoundingClientRect();const m=$("menu");const t=TRACKS.find(y=>y.id==x.dataset.more);
    m.innerHTML=`<button role="menuitem">${ic("pencil",18)}重命名</button><button role="menuitem">${ic(t.type==="bgm"?"zap":"repeat",18)}改为 ${t.type==="bgm"?"SE":"BGM"}</button>${t.src!=="upload"?`<button role="menuitem">${ic("ext",18)}在${SRC[t.src]}打开</button>`:""}<hr><button role="menuitem" class="danger">${ic("trash",18)}删除</button>`;
    m.className="menu on";m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+"px";m.style.left=Math.max(8,r.right-m.offsetWidth)+"px"}
});
document.addEventListener("input",(e)=>{if(e.target.id==="q"){S.q=e.target.value;renderLedger();}if(e.target.id==="mq"){S.mq=e.target.value;renderMods()}});
document.addEventListener("keydown",(e)=>{if(e.key==="Escape"){$("scrim").className="scrim";$("menu").className="menu"}
  if(e.key==="/"&&!/INPUT/.test(document.activeElement.tagName)){e.preventDefault();($("q")||$("mq")).focus()}
  if(e.key===" "&&S.play&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();stop()}});
function openDlg(tab){
  const mod=S.mod==="*"?"雾港疑案":S.mod;
  const tabs=[["upload","上传文件"],["search","搜索平台"],["list","导入歌单"]];
  let body="";
  if(tab==="upload")body=`<div class="drop"><span style="color:var(--on)">${ic("upload",28)}</span><b>拖入音频文件</b><span>或 <u>选择文件</u>，可以一次放入多个</span></div>
   <div class="q">${[["夜雨 · 檐下","bgm","03:12","ok"],["敲门声（三下）","se","00:02","ok"],["远处的警笛","se","00:09","58%"]].map(([n,ty,d,s])=>`<div class="qi"><input class="nm" value="${n}" aria-label="曲名"><div class="seg sm"><button aria-pressed="${ty==="bgm"}">BGM</button><button aria-pressed="${ty==="se"}">SE</button></div><span class="st mono">${d}</span><span class="st ${s==="ok"?"ok":""} mono">${s==="ok"?ic("check",16):s}</span></div>`).join("")}</div>`;
  if(tab==="search")body=`<div class="seg" style="align-self:flex-start"><button aria-pressed="true">网易云音乐</button><button aria-pressed="false">QQ 音乐</button></div>
   <label class="field">${ic("search",16)}<input placeholder="搜索歌曲，或粘贴歌曲 ID / 分享链接" aria-label="搜索歌曲" value="Satie"></label>
   <div class="q">${[["Gymnopédie No.1","Erik Satie / Alexandre Tharaud","03:11",1],["Gymnopédie No.3","Erik Satie","02:30",0],["Gnossienne No.1","Erik Satie","03:41",0]].map(([n,a,d,ad])=>`<div class="qi" style="grid-template-columns:minmax(0,1fr) 52px 78px"><div class="ttl"><b style="font-size:14px">${n}</b><span>${a}</span></div><span class="st mono">${d}</span><button class="btn sm ${ad?"text":"tonal"}" ${ad?"disabled style='opacity:.7'":""}>${ad?ic("check",14)+"已添加":"添加"}</button></div>`).join("")}</div>`;
  if(tab==="list")body=`<div class="seg" style="align-self:flex-start"><button aria-pressed="true">网易云音乐</button><button aria-pressed="false">QQ 音乐</button></div>
   <label class="field">${ic("list",16)}<input placeholder="粘贴歌单链接或歌单 ID" aria-label="歌单链接"></label>
   <p style="color:var(--on-var);font-size:13px">歌单每页载入 50 首，勾选的曲目会跨页保留；逐首添加，已存在的会跳过。</p>`;
  $("scrim").innerHTML=`<div class="dlg fade" role="dialog" aria-modal="true" aria-label="添加曲目"><header><h2>添加曲目<span class="sub">到「${mod}」</span></h2><button class="iconbtn" id="closeDlg" aria-label="关闭">${ic("x")}</button></header>
   <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}</div><div class="body">${body}</div>
   <footer><span class="hint">${tab==="upload"?"30 秒以内的默认记为 SE，可以逐个改。":""}</span><button class="btn text" id="closeDlg">取消</button>${tab==="upload"?'<button class="btn fill">添加 3 首</button>':""}</footer></div>`;
  $("scrim").className="scrim on";
}
// 拖入文件：整张提示单都是投放区
const L=$("ledger");
["dragenter","dragover"].forEach(n=>L.addEventListener(n,(e)=>{e.preventDefault();if(S.mod!=="*")L.classList.add("drag")}));
["dragleave","drop"].forEach(n=>L.addEventListener(n,(e)=>{e.preventDefault();L.classList.remove("drag")}));
renderAll();
if(st==="playing")play(3,.38);
if(st==="playse")play(6,.5);
if(st==="select"){S.sel=new Set([2,3,5]);renderAll()}
if(st==="add")openDlg("upload");
if(st==="addsearch")openDlg("search");
if(st==="drag"){L.classList.add("drag")}
if(st==="menu"){setTimeout(()=>document.querySelector("[data-more='4']").click(),50)}
if(st==="all"){S.mod="*";renderAll()}
</script>
</body>
</html>
