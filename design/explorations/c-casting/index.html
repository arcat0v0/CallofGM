<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物管理 · CoGM</title>
<style>
:root{
  --surface:#12140e;
  --surface-container-lowest:#0d0f09;
  --surface-container-low:#1a1c16;
  --surface-container:#1e2019;
  --surface-container-high:#292b23;
  --surface-container-highest:#33362e;
  --on-surface:#e2e3d8;
  --on-surface-variant:#c5c8b9;
  --outline:#8f9285;
  --outline-variant:#45483d;
  --primary:#b4d087;
  --on-primary:#223600;
  --primary-container:#374d13;
  --on-primary-container:#d0eda1;
  --secondary:#56d6f5;
  --tertiary:#bac3ff;
  --tertiary-container:#2f4090;
  --error:#ffb4a6;
  --warning:#f0c11c;

  --r-4:4px; --r-8:8px; --r-12:12px; --r-16:16px; --r-28:28px; --r-full:999px;
  --font-sans:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --hair:1px solid var(--outline-variant);
  --rail-w:96px;
  --nav-w:232px;
  --insp-w:clamp(380px,31.5vw,456px);
  --dur:120ms;
  --scrim:rgb(13 15 9 / .72);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  background:var(--surface-container-low);color:var(--on-surface);
  font:14px/1.5 var(--font-sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-scroll]{scrollbar-width:thin;scrollbar-color:var(--outline-variant) transparent}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app shell ---------- */
.app{display:flex;height:100vh}
.rail{
  width:var(--rail-w);flex:none;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;
  padding:16px 0 16px;border-right:var(--hair);
}
.logo{width:40px;height:40px;border-radius:var(--r-full);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;margin-bottom:20px}
.logo svg{width:22px;height:22px}
.rail nav{display:flex;flex-direction:column;gap:6px;flex:1}
.rail a{
  display:flex;flex-direction:column;align-items:center;gap:4px;width:80px;
  color:var(--on-surface-variant);text-decoration:none;font-size:12px;line-height:16px;padding:2px 0 4px;border-radius:var(--r-12);
}
.rail a .pill{width:56px;height:32px;border-radius:var(--r-full);display:grid;place-items:center}
.rail a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.rail a:hover .pill{background:var(--surface-container-high)}
.rail a[aria-current="page"]{color:var(--on-surface);font-weight:600}
.rail a[aria-current="page"] .pill{background:var(--primary-container);color:var(--on-primary-container)}
.rail-foot{display:flex;flex-direction:column;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:var(--r-full);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;font-size:13px;font-weight:600;letter-spacing:.02em}
.icon-btn{width:40px;height:40px;border-radius:var(--r-full);border:0;background:none;color:var(--on-surface-variant);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-container-high);color:var(--on-surface)}
.icon-btn svg{width:20px;height:20px}

.page{
  flex:1;min-width:0;display:grid;
  grid-template-columns:var(--nav-w) minmax(0,1fr) var(--insp-w);
  height:100vh;
}

/* ---------- pane 1: rule + folders ---------- */
.pane-nav{background:var(--surface);border-right:var(--hair);display:flex;flex-direction:column;min-height:0}
.nav-head{padding:22px 18px 14px;display:flex;align-items:baseline;justify-content:space-between}
.nav-head h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.nav-head .mono{font-size:12px;color:var(--on-surface-variant)}
.rules{display:flex;flex-direction:column;border-top:var(--hair);border-bottom:var(--hair)}
.rule{
  position:relative;display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:8px;
  text-align:left;border:0;background:none;padding:14px 18px 14px 20px;color:var(--on-surface-variant);
}
.rule + .rule{border-top:var(--hair)}
.rule .short{font-size:1.375rem;line-height:1.2;font-weight:600;letter-spacing:-.005em}
.rule .count{font-size:13px}
.rule .full{grid-column:1/-1;font-size:12px;line-height:1.4;margin-top:3px}
.rule:hover{background:var(--surface-container-lowest);color:var(--on-surface)}
.rule[aria-pressed="true"]{background:var(--surface-container-low);color:var(--on-surface)}
.rule[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.rule[aria-pressed="true"] .count{color:var(--on-surface)}
.rule[aria-pressed="true"] .full{color:var(--on-surface-variant)}
.rule:focus-visible{outline-offset:-2px}

.folders{flex:1;min-height:0;overflow:auto;padding:10px 0 24px}
.fgroup{padding:6px 0}
.fgroup h3{margin:0;padding:10px 18px 4px 20px;font-size:11px;line-height:16px;font-weight:600;color:var(--on-surface-variant);letter-spacing:.06em;display:flex;justify-content:space-between}
.folder{
  position:relative;display:flex;align-items:center;gap:8px;width:100%;height:32px;
  border:0;background:none;text-align:left;padding:0 18px 0 20px;font-size:13px;color:var(--on-surface-variant);
}
.folder .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .n{font-size:12px;color:var(--on-surface-variant)}
.folder:hover{background:var(--surface-container-lowest);color:var(--on-surface)}
.folder[aria-pressed="true"]{color:var(--on-surface);font-weight:600;background:var(--surface-container-low)}
.folder[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--primary)}
.folder[aria-pressed="true"] .n{color:var(--on-surface)}
.folder.zero .lbl,.folder.zero .n{opacity:.55}
.folder:focus-visible{outline-offset:-2px}
.folder.all{font-size:14px;height:36px}
.folder .sub{font-size:11px;color:var(--on-surface-variant);font-weight:400}

/* ---------- pane 2: results ---------- */
.pane-list{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface-container-low)}
.list-head{padding:18px 24px 0;border-bottom:var(--hair)}
.head-row{display:flex;align-items:center;gap:12px;min-height:40px}
.scope{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.scope h2{margin:0;font-size:18px;line-height:1.3;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope h2 .rule-tag{color:var(--on-surface-variant);font-weight:500}
.scope h2 .sep{color:var(--outline);margin:0 .35em;font-weight:400}
.scope .total{font-size:12px;color:var(--on-surface-variant);white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px;padding:12px 0 14px}
.mobile-only{display:none !important}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
  border-radius:var(--r-8);border:1px solid transparent;background:none;font-size:13px;font-weight:500;white-space:nowrap;
  color:var(--on-surface);
}
.btn svg.i{width:16px;height:16px}
.btn-primary{background:var(--primary);color:var(--on-primary);font-weight:600}
.btn-primary:hover{background:var(--on-primary-container)}
.btn-ghost{color:var(--on-surface-variant)}
.btn-ghost:hover{background:var(--surface-container-high);color:var(--on-surface)}
.btn-outline{border-color:var(--outline-variant);color:var(--on-surface)}
.btn-outline:hover{background:var(--surface-container-high)}
.btn-accent{border-color:var(--primary);color:var(--primary)}
.btn-accent:hover{background:var(--primary-container);color:var(--on-primary-container)}
.btn-danger{border-color:var(--error);color:var(--error)}
.btn-danger:hover{background:rgb(255 180 166 / .1)}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:var(--r-4)}
.btn-icon{width:36px;padding:0}

.search{position:relative;flex:1;min-width:0}
.search svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--on-surface-variant);pointer-events:none}
.search input{
  width:100%;height:36px;border-radius:var(--r-8);border:var(--hair);background:var(--surface-container-lowest);
  padding:0 64px 0 34px;font-size:13px;color:var(--on-surface);
}
.search input::placeholder{color:var(--on-surface-variant)}
.search input:hover{border-color:var(--outline)}
.search input:focus{outline:none;border-color:var(--primary)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px/18px var(--font-mono);color:var(--on-surface-variant);
  border:var(--hair);border-radius:var(--r-4);padding:0 6px;
}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:var(--r-4);background:none;color:var(--on-surface-variant);display:none;place-items:center}
.search .clear:hover{background:var(--surface-container-high);color:var(--on-surface)}
.search.has-q kbd{display:none}
.search.has-q .clear{display:grid}

.select{position:relative}
.select select{
  appearance:none;height:36px;border-radius:var(--r-8);border:var(--hair);background:var(--surface-container-lowest);
  padding:0 30px 0 12px;font-size:13px;color:var(--on-surface);
}
.select select:hover{border-color:var(--outline)}
.select svg.i{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--on-surface-variant);width:14px;height:14px}

.seg{display:inline-flex;border:var(--hair);border-radius:var(--r-8);padding:2px;background:var(--surface-container-lowest);height:36px}
.seg button{
  display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:6px;padding:0 10px;
  font-size:13px;color:var(--on-surface-variant);white-space:nowrap
}
.seg button:hover{color:var(--on-surface)}
.seg button[aria-pressed="true"]{background:var(--surface-container-highest);color:var(--on-surface);font-weight:600}

.results{flex:1;min-height:0;overflow:auto;position:relative}
.results.fade{animation:fade var(--dur) ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* list view */
.colhead{
  position:sticky;top:0;z-index:2;background:var(--surface-container-low);
  display:grid;grid-template-columns:var(--row-cols);align-items:center;column-gap:12px;
  height:30px;padding:0 24px;border-bottom:var(--hair);font-size:11px;color:var(--on-surface-variant);font-weight:600;letter-spacing:.04em
}
.colhead .r{text-align:right}
.results{--row-cols:32px minmax(0,1fr) 40px 40px 72px}
.row{
  position:relative;display:grid;grid-template-columns:var(--row-cols);align-items:center;column-gap:12px;
  width:100%;height:48px;padding:0 24px;border:0;border-bottom:1px solid rgb(69 72 61 / .5);background:none;text-align:left;
}
.row:hover{background:var(--surface-container)}
.row[aria-selected="true"]{background:var(--surface-container-high)}
.row[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.row:focus-visible{outline-offset:-2px}
.thumb{width:32px;height:43px;border-radius:2px;overflow:hidden;border:var(--hair);background:var(--surface-container-lowest);display:grid;place-items:center;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .glyph{font-size:17px;font-weight:300;color:var(--outline-variant);line-height:1}
.row:hover .thumb .glyph,.row[aria-selected="true"] .thumb .glyph{color:var(--outline)}
.row .who{min-width:0;display:flex;flex-direction:column;gap:1px}
.row .nm{font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row[aria-selected="true"] .nm{color:var(--primary)}
.meta{font-size:12px;line-height:16px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:0}
.meta .none{opacity:.8}
.meta .dot{margin:0 6px;color:var(--outline)}
.meta .pl{display:inline-flex;align-items:center;gap:3px;color:var(--on-surface)}
.meta .pl svg.i{width:12px;height:12px;stroke-width:2}
.meta .mods{overflow:hidden;text-overflow:ellipsis}
.row .c{font-size:12px;color:var(--on-surface-variant);text-align:right}
.row .k{font-size:12px;color:var(--on-surface-variant);text-align:right;letter-spacing:.02em}
.row .k.pc{color:var(--on-surface)}
.row .t{font-size:12px;color:var(--on-surface-variant);text-align:right;white-space:nowrap}
mark{background:var(--surface-container-highest);color:inherit;border-radius:2px;box-shadow:0 1px 0 var(--outline)}

/* wall view */
.wall{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:18px 12px;padding:20px 24px 32px;
}
.item{scroll-margin:20px 0 20px}
.row.item{scroll-margin:31px 0 0}
.tile{display:flex;flex-direction:column;gap:7px;border:0;background:none;padding:0;text-align:left;min-width:0;border-radius:var(--r-4)}
.frame{
  position:relative;width:100%;aspect-ratio:3/4;border:var(--hair);border-radius:3px;overflow:hidden;
  background:var(--surface-container-lowest);display:grid;place-items:center;
}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame .glyph{font-size:40px;font-weight:300;line-height:1;color:var(--surface-container-highest);user-select:none}
.frame .corner{position:absolute;left:7px;bottom:6px;font:11px/1 var(--font-mono);color:var(--outline);letter-spacing:.02em}
.tile .frame .corner{display:none}
.tile:hover .frame{border-color:var(--outline)}
.tile:hover .frame .glyph{color:var(--outline-variant)}
.tile[aria-selected="true"] .frame{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.tile[aria-selected="true"] .frame .glyph{color:var(--outline-variant)}
.tile:focus-visible{outline-offset:3px}
.tile .tl{display:flex;flex-direction:column;gap:1px;min-width:0;padding:0 1px}
.tile .nm{font-size:13px;line-height:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile[aria-selected="true"] .nm{color:var(--primary)}
.tile .meta{font-size:11px;line-height:15px}
.tile .meta .kd{font-family:var(--font-mono);color:var(--on-surface)}

.xrule{padding:8px 16px 24px;display:flex;gap:8px}
/* empty */
.empty{padding:64px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:420px}
.empty .ef{width:72px;aspect-ratio:3/4;border:1px dashed var(--outline-variant);border-radius:3px;margin-bottom:14px;display:grid;place-items:center;color:var(--outline-variant);font-size:28px;font-weight:300}
.empty h3{margin:0;font-size:15px;font-weight:600}
.empty p{margin:0;font-size:13px;color:var(--on-surface-variant)}
.empty .acts{display:flex;gap:8px;margin-top:12px}

/* ---------- pane 3: inspector ---------- */
.pane-insp{background:var(--surface-container);border-left:var(--hair);overflow:auto;min-height:0;min-width:0}
.insp{padding:24px 28px 32px}
.insp.enter{animation:slide 160ms ease-out}
@keyframes slide{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.insp-back{display:none}
.lead{display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:20px}
.lead .frame{width:240px;border-radius:4px}
.lead .frame .glyph{font-size:112px;color:var(--outline-variant)}
.lead .frame .corner{font-size:11px}
.lead .frame .cap{
  position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;
  padding:8px 10px;font:11px/1 var(--font-mono);color:var(--on-surface);background:rgb(13 15 9 / .72);letter-spacing:.02em
}
.facts{margin:0;display:flex;flex-direction:column;gap:14px;padding-top:2px}
.facts div{display:flex;flex-direction:column;gap:2px;border-top:var(--hair);padding-top:8px}
.facts dt{font-size:11px;color:var(--on-surface-variant);font-weight:600;letter-spacing:.04em}
.facts dd{margin:0;font-size:13px;color:var(--on-surface)}
.facts dd .mono{font-size:13px}
.facts dd small{display:block;font-size:11px;color:var(--on-surface-variant);font-family:var(--font-mono)}
.exprs{display:flex;align-items:center;gap:2px;margin-top:10px;width:240px;flex-wrap:wrap;border-bottom:var(--hair)}
.exprs .lab{font-size:11px;font-weight:600;color:var(--on-surface-variant);margin-right:8px;letter-spacing:.04em}
.exprs .lab .mono{font-weight:400;margin-left:4px}
.exprs button{
  position:relative;border:0;background:none;padding:6px 8px 7px;font-size:12px;color:var(--on-surface-variant);border-radius:var(--r-4) var(--r-4) 0 0
}
.exprs button:hover{color:var(--on-surface);background:var(--surface-container-high)}
.exprs button[aria-selected="true"]{color:var(--on-surface);font-weight:600}
.exprs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--primary)}
.exprs .noexp{font-size:12px;color:var(--on-surface-variant);padding:6px 0 7px}

.ident{margin-top:20px}
.ident h2{margin:0;font-size:1.75rem;line-height:1.25;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ident .line{margin-top:4px;font-size:13px;color:var(--on-surface-variant);display:flex;align-items:center;flex-wrap:wrap;gap:0}
.ident .line .dot{margin:0 8px;color:var(--outline)}
.ident .line .ro{display:inline-flex;align-items:center;gap:4px;color:var(--on-surface)}
.ident .line .ro svg.i{width:13px;height:13px}
.actions{display:flex;gap:8px;margin-top:16px;position:relative}
.actions .spacer{flex:1}

.sect{margin-top:26px;position:relative}
.sect-h{display:flex;align-items:center;gap:8px;height:28px;border-bottom:var(--hair);padding-bottom:2px}
.sect-h h3{margin:0;font-size:12px;font-weight:600;color:var(--on-surface-variant);letter-spacing:.04em}
.sect-h .mono{font-size:12px;color:var(--on-surface-variant)}
.sect-h .rt{margin-left:auto;font-size:12px;color:var(--on-surface-variant)}
.sect-h .btn-sm{margin-left:auto;margin-right:-8px}
.modlist{list-style:none;margin:0;padding:0}
.modlist li{display:flex;align-items:center;gap:10px;height:36px;border-bottom:1px solid rgb(69 72 61 / .5);font-size:13px}
.modlist li .mi{color:var(--on-surface-variant);display:grid}
.modlist li .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modlist li .x{width:28px;height:28px;border:0;border-radius:var(--r-4);background:none;color:var(--on-surface-variant);display:grid;place-items:center;opacity:0}
.modlist li:hover .x,.modlist li .x:focus-visible{opacity:1}
.modlist li .x:hover{background:var(--surface-container-high);color:var(--error)}
.modlist .emptyli{color:var(--on-surface-variant)}
.summary{margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.summary div{padding:9px 0 9px;border-bottom:1px solid rgb(69 72 61 / .5);min-width:0}
.summary dt{font-size:11px;color:var(--on-surface-variant);letter-spacing:.04em;line-height:16px}
.summary dd{margin:2px 0 0;font-size:15px;line-height:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.summary-empty{font-size:13px;color:var(--on-surface-variant);padding:12px 0}

.insp-empty{height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:24px 28px;gap:12px}
.insp-empty .frame{width:240px}
.frame.blank{border-style:dashed;background:none}
.insp-empty p{margin:0;font-size:13px;color:var(--on-surface-variant)}

/* popovers */
.pop{
  position:absolute;z-index:20;min-width:200px;background:var(--surface-container-highest);border:1px solid var(--outline-variant);
  border-radius:var(--r-8);padding:4px;display:none
}
.pop.open{display:block}
.pop button,.pop label{
  display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;background:none;border-radius:var(--r-4);
  font-size:13px;text-align:left;color:var(--on-surface);cursor:pointer
}
.pop button:hover,.pop label:hover{background:var(--surface-container-high)}
.pop .danger{color:var(--error)}
.pop hr{border:0;border-top:var(--hair);margin:4px 0}
.pop .ph{font-size:11px;font-weight:600;color:var(--on-surface-variant);padding:8px 10px 4px;letter-spacing:.04em}
.pop input[type=checkbox]{accent-color:var(--primary);width:15px;height:15px;margin:0}
.pop label .n{margin-left:auto;font-size:11px;color:var(--on-surface-variant)}
#morePop{right:0;top:42px}
#linkPop{right:0;top:32px;width:240px}

/* dialog */
dialog{
  border:1px solid var(--outline-variant);border-radius:var(--r-16);background:var(--surface-container-high);color:var(--on-surface);
  padding:24px;width:min(380px,calc(100vw - 32px))
}
dialog::backdrop{background:var(--scrim)}
dialog h3{margin:0 0 6px;font-size:17px;font-weight:600}
dialog p{margin:0;font-size:13px;color:var(--on-surface-variant)}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--surface-container-highest);
  border:var(--hair);border-radius:var(--r-8);padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity 150ms,transform 150ms;z-index:50;white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* sheet (mobile filters) */
.sheet-scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.sheet{
  position:fixed;left:var(--rail-w);right:0;bottom:0;max-height:82vh;z-index:41;background:var(--surface);
  border-top:var(--hair);border-radius:var(--r-16) var(--r-16) 0 0;display:none;flex-direction:column
}
.sheet.open,.sheet-scrim.open{display:flex}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 20px;border-bottom:var(--hair)}
.sheet-h h3{margin:0;font-size:15px;font-weight:600}
.sheet .folders{padding-bottom:28px}

@media (prefers-reduced-motion: reduce){
  .results.fade,.insp.enter{animation:none}
  .toast{transition:none}
}

/* ---------- mobile ---------- */
@media (max-width:760px){
  body{overflow:auto;height:auto}
  .app{height:auto;min-height:100vh;align-items:flex-start}
  .rail{position:sticky;top:0;height:100vh;padding-top:12px}
  .rail nav{gap:2px}
  .page{display:block;height:auto}
  .pane-nav{display:none}
  .pane-list{min-height:100vh}
  .list-head{padding:16px 16px 0;border-bottom:0}
  .head-row{min-height:36px}
  .mobile-only{display:flex !important}
  .mrules.mobile-only{display:grid !important}
  .head-row{margin-top:14px}
  .tools{gap:6px}
  .tools .btn{padding:0 10px}
  .select select{padding:0 24px 0 10px}
  .select svg.i{right:6px}
  .mrules{display:grid;grid-template-columns:1fr 1fr;border:var(--hair);border-radius:var(--r-8);overflow:hidden;margin:12px 0 0}
  .mrules button{border:0;background:var(--surface);padding:8px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:0;color:var(--on-surface-variant);position:relative}
  .mrules button + button{border-left:var(--hair)}
  .mrules .short{font-size:16px;font-weight:600;line-height:1.3}
  .mrules .mono{font-size:12px}
  .mrules button[aria-pressed="true"]{background:var(--surface-container-high);color:var(--on-surface)}
  .mrules button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary)}
  .scope{flex-direction:column;gap:0}
  .scope h2{font-size:16px;white-space:normal}
  #btnImport{display:none}
  .btn-new .full{display:none}
  .tools{
    flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--surface-container-low);
    margin:0 -16px;padding:10px 16px;border-bottom:var(--hair)
  }
  .tools .search{flex-basis:100%}
  .search kbd{display:none}
  .search input{padding-right:40px}
  .tools .select{flex:1}
  .tools .select select{width:100%}
  .seg button .tx{display:none}
  .results{overflow:visible;--row-cols:32px minmax(0,1fr) auto}
  .colhead{display:none}
  .row{padding:0 16px;height:52px}
  .row .c,.row .kdesk{display:none}
  .row .side{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .wall{grid-template-columns:repeat(2,minmax(0,1fr));padding:16px;gap:16px 12px}
  .frame .glyph{font-size:56px}
  .pane-insp{display:none;border-left:0}
  body.m-detail .pane-list{display:none}
  body.m-detail .pane-insp{display:block;min-height:100vh}
  .insp{padding:12px 16px 32px}
  .insp-back{display:flex;margin:0 0 14px -10px}
  .lead{grid-template-columns:168px minmax(0,1fr);column-gap:14px}
  .lead .frame{width:168px}
  .lead .frame .glyph{font-size:80px}
  .exprs{width:100%}
  .ident h2{font-size:1.5rem}
  .actions{flex-wrap:wrap}
  #morePop{top:42px}
  .insp-empty .frame{width:168px}
}
@media (min-width:761px){
  .row .side{display:contents}
  .row .kmob{display:none}
}
@media (min-width:761px) and (max-width:1180px){
  :root{--nav-w:200px;--insp-w:360px}
  .lead{grid-template-columns:200px minmax(0,1fr)}
  .lead .frame,.exprs{width:200px}
}

  $("#scopeCount").textContent = state.q ? `${n} / ${chars.filter(c => match(c, "q")).length}` : `${n} 人`;
  $("#btnImport").hidden = state.rule !== "coc7e";
  $("#vList").setAttribute("aria-pressed", state.view === "list");
  $("#vWall").setAttribute("aria-pressed", state.view === "wall");
  $("#sort").value = state.sort;
  $("#searchBox").classList.toggle("has-q", !!state.q);
  if ($("#q").value !== state.q) $("#q").value = state.q;
}
function hl(name) {
  if (!state.q) return esc(name);
  const i = name.toLowerCase().indexOf(state.q.toLowerCase());
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + state.q.length)) + "</mark>" + esc(name.slice(i + state.q.length));
}
function frameHTML(c, cls = "") {
  const g = `<span class="glyph" aria-hidden="true">${esc(glyph(c.name))}</span>`;
  const img = c.portrait ? `<img src="${ASSET + c.portrait}" alt="" loading="lazy" onerror="imgFail(this)">` : "";
  return g + img;
}
function imgFail(img) { img.remove(); }
function metaHTML(c, mini) {
  const mods = c.modules.length ? `<span class="mods">${c.modules.map(esc).join("、")}</span>` : `<span class="mods none">未归入模组</span>`;
  const pl = c.owner.kind === "pl" ? `<span class="dot">·</span><span class="pl" title="玩家持有 · ${esc(c.owner.name)}">${icon("lock")}${esc(c.owner.name)}</span>` : "";
  if (mini) return `<span class="kd">${c.kind}</span><span class="dot">·</span>` + (c.owner.kind === "pl" ? `<span class="pl" title="玩家持有 · ${esc(c.owner.name)}">${icon("lock")}${esc(c.owner.name)}</span>` : mods);
  return mods + pl;
}
let lastView = null;
function renderResults() {
  const list = results();
  renderHead(list.length);
  const box = $("#results");
  if (!list.length) {
    const hasF = state.type || state.own || state.mod;
    const others = state.q ? RULES.filter(r => r.id !== state.rule).map(r => [r, chars.filter(c => c.ruleId === r.id && c.name.toLowerCase().includes(state.q.toLowerCase())).length]).filter(([, n]) => n) : [];
    box.innerHTML = `<div class="empty">
      <div class="ef" aria-hidden="true"></div>
      <h3>${state.q ? `没有名为“${esc(state.q)}”的人物` : "此范围内没有人物"}</h3>
      <p>${esc(ruleOf(state.rule).short)} · ${esc(scopeLabel().join(" · "))}</p>
      <div class="acts">
        ${state.q ? `<button class="btn btn-outline btn-sm" data-act="clear-q">清除搜索</button>` : ""}
        ${hasF ? `<button class="btn btn-ghost btn-sm" data-act="clear-f">显示全部人物</button>` : ""}
        ${others.map(([r, n]) => `<button class="btn btn-ghost btn-sm" data-rule="${r.id}">在 ${esc(r.short)} 中有 <span class="mono">${n}</span> 个匹配</button>`).join("")}
      </div></div>`;
  } else if (state.view === "list") {
    box.innerHTML = `<div class="colhead" aria-hidden="true"><span></span><span>人物 · 所属模组</span><span class="r">表情</span><span class="r">类型</span><span class="r">更新</span></div>
    <div role="listbox" aria-label="人物" id="items">` + list.map(c => `
      <button class="row item" data-id="${c.id}" role="option" aria-selected="false" tabindex="-1">
        <span class="thumb">${frameHTML(c)}</span>
        <span class="who"><span class="nm">${hl(c.name)}</span><span class="meta">${metaHTML(c)}</span></span>
        <span class="c mono">${c.expressions.length || "—"}</span>
        <span class="k kdesk mono ${c.kind === "PC" ? "pc" : ""}">${c.kind}</span>
        <span class="side"><span class="t mono">${rel(c.updatedAt)}</span><span class="k kmob mono ${c.kind === "PC" ? "pc" : ""}">${c.kind}</span></span>
      </button>`).join("") + `</div>`;
  } else {
    box.innerHTML = `<div class="wall" role="listbox" aria-label="人物" id="items">` + list.map(c => `
      <button class="tile item" data-id="${c.id}" role="option" aria-selected="false" tabindex="-1">
        <span class="frame">${frameHTML(c)}</span>
        <span class="tl"><span class="nm">${hl(c.name)}</span><span class="meta">${metaHTML(c, true)}</span></span>
      </button>`).join("") + `</div>`;
  }
  if (list.length && state.q) {
    const others = RULES.filter(r => r.id !== state.rule).map(r => [r, chars.filter(c => c.ruleId === r.id && c.name.toLowerCase().includes(state.q.toLowerCase())).length]).filter(([, n]) => n);
    if (others.length) box.insertAdjacentHTML("beforeend", `<div class="xrule">${others.map(([r, n]) => `<button class="btn btn-ghost btn-sm" data-rule="${r.id}">${esc(r.short)} 中另有 <span class="mono">${n}</span> 个匹配</button>`).join("")}</div>`);
  }
  if (lastView !== null && lastView !== state.view) {
    box.classList.remove("fade"); void box.offsetWidth; box.classList.add("fade");
  }
  lastView = state.view;
  // keep selection valid
  if (!list.find(c => c.id === state.sel)) {
    const remembered = list.find(c => c.id === state.lastSel[state.rule]);
    state.sel = (remembered || list[0] || {}).id || null;
    state.expr = 0;
  }
  markSel(false);
  return list;
}
function markSel(scroll, block = "nearest") {
  document.querySelectorAll("#items .item").forEach(el => {
    const on = el.dataset.id === state.sel;
    el.setAttribute("aria-selected", on);
    el.tabIndex = on ? 0 : -1;
    if (on && scroll) el.scrollIntoView({ block });
  });
  if (!document.querySelector('#items .item[tabindex="0"]')) {
    const f = document.querySelector("#items .item"); if (f) f.tabIndex = 0;
  }
}

/* ---------- pane 3 ---------- */
function renderInspector(animate) {
  const el = $("#insp");
  const c = chars.find(x => x.id === state.sel && x.ruleId === state.rule);
  const list = results();
  if (!c || !list.find(x => x.id === c.id)) {
    el.className = "insp";
    el.innerHTML = `<div class="insp-empty">
      <button class="btn btn-ghost insp-back" data-act="back">${icon("back")}返回列表</button>
      <div class="frame blank"></div>
      <p>${list.length ? "未选中人物" : "当前范围内没有人物"}</p></div>`;
    return;
  }
  const r = ruleOf(c.ruleId);
  const pl = c.owner.kind === "pl";
  const ex = c.expressions;
  const ei = Math.min(state.expr, Math.max(ex.length - 1, 0));
  const idLine = pl
    ? `<span>${c.kind}</span><span class="dot">·</span><span>${esc(r.short)}</span><span class="dot">·</span><span class="ro">${icon("lock")}玩家持有 · ${esc(c.owner.name)}</span>`
    : `<span>${c.kind}</span><span class="dot">·</span><span>${esc(r.short)}</span><span class="dot">·</span><span>我创建的</span>`;
  const mods = c.modules;
  el.innerHTML = `
    <button class="btn btn-ghost insp-back" data-act="back">${icon("back")}返回列表</button>
    <div class="lead">
      <div>
        <div class="frame">${frameHTML(c)}</div>
        <div class="exprs" role="tablist" aria-label="表情">
          ${ex.length ? `<span class="lab">表情<span class="mono">${ex.length}</span></span>` + ex.map((e, i) => `<button role="tab" data-expr="${i}" aria-selected="${i === ei}">${esc(e)}</button>`).join("")
                      : `<span class="noexp">未设置表情</span>`}
        </div>
      </div>
      <dl class="facts">
        <div><dt>编号</dt><dd class="mono">${esc(c.id)}</dd></div>
        <div><dt>立绘</dt><dd>${c.portrait ? "已上传" : "未上传"}</dd></div>
        <div><dt>更新</dt><dd><span class="mono">${rel(c.updatedAt)}</span><small>${abs(c.updatedAt)}</small></dd></div>
      </dl>
    </div>
    <div class="ident">
      <h2>${esc(c.name)}</h2>
      <div class="line">${idLine}</div>
    </div>
    <div class="actions">
      ${pl ? `<button class="btn btn-accent" data-act="edit">${icon("eye")}查看人物卡</button>`
           : `<button class="btn btn-accent" data-act="edit">${icon("edit")}编辑人物卡</button>
              <button class="btn btn-ghost" data-act="portraits">${icon("image")}管理立绘</button>
              <span class="spacer"></span>
              <button class="btn btn-ghost btn-icon" data-act="more" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false">${icon("more")}</button>
              <div class="pop" id="morePop" role="menu">
                <button role="menuitem" data-act="link">${icon("link")}关联模组</button>
                <hr>
                <button role="menuitem" class="danger" data-act="delete">${icon("trash")}删除人物</button>
              </div>`}
    </div>
    <section class="sect" id="modSect">
      <div class="sect-h"><h3>所属模组</h3><span class="mono">${mods.length}</span>
        ${pl ? `<span class="rt">玩家经审核加入</span>` : `<button class="btn btn-ghost btn-sm" data-act="link" aria-haspopup="true">${icon("plus")}关联</button>`}
      </div>
      <ul class="modlist">
        ${mods.length ? mods.map(m => `<li><span class="mi">${icon("book")}</span><span class="mn">${esc(m)}</span>${pl ? "" : `<button class="x" data-act="unlink" data-mod="${esc(m)}" aria-label="移出 ${esc(m)}">${icon("x")}</button>`}</li>`).join("")
                    : `<li class="emptyli">未归入模组</li>`}
      </ul>
      ${pl ? "" : `<div class="pop" id="linkPop"><div class="ph">${esc(r.short)} 的模组</div>
        ${modsOf(c.ruleId).map(m => `<label><input type="checkbox" data-mod="${esc(m)}" ${mods.includes(m) ? "checked" : ""}>${esc(m)}<span class="n mono">${chars.filter(x => x.modules.includes(m)).length}</span></label>`).join("")}
      </div>`}
    </section>
    <section class="sect">
      <div class="sect-h"><h3>人物卡摘要</h3><span class="rt">${esc(r.name)}</span></div>
      ${c.summary.length ? `<dl class="summary">${c.summary.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`
                         : `<div class="summary-empty">人物卡尚未填写</div>`}
    </section>`;
  el.className = "insp";
  if (animate) { void el.offsetWidth; el.classList.add("enter"); }
}

/* ---------- hash ---------- */
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("rule") && ruleOf(p.get("rule"))) state.rule = p.get("rule");
  if (p.get("sel")) {
    const c = chars.find(x => x.id === p.get("sel"));
    if (c) { if (!p.get("rule")) state.rule = c.ruleId; state.sel = c.id; state.lastSel[c.ruleId] = c.id; }
  }
  if (["list", "wall"].includes(p.get("view"))) state.view = p.get("view");
  if (p.has("q")) state.q = p.get("q");
  if (["PC", "NPC"].includes(p.get("type"))) state.type = p.get("type");
  if (["gm", "pl"].includes(p.get("own"))) state.own = p.get("own");
  if (p.get("mod")) state.mod = p.get("mod") === "none" ? "__none" : p.get("mod");
  if (["name", "updated"].includes(p.get("sort"))) state.sort = p.get("sort");
  state.mDetail = p.get("m") === "detail";
}
function writeHash() {
  const p = new URLSearchParams();
  p.set("rule", state.rule);
  if (state.sel) p.set("sel", state.sel);
  p.set("view", state.view);
  if (state.q) p.set("q", state.q);
  if (state.type) p.set("type", state.type);
  if (state.own) p.set("own", state.own);
  if (state.mod) p.set("mod", state.mod === "__none" ? "none" : state.mod);
  if (state.sort !== "updated") p.set("sort", state.sort);
  if (state.mDetail) p.set("m", "detail");
  history.replaceState(null, "", "#" + p.toString());
}

/* ---------- orchestration ---------- */
function renderAll(animateInsp) {
  renderRules();
  renderFolders();
  renderResults();
  renderInspector(animateInsp);
  document.body.classList.toggle("m-detail", state.mDetail && mq.matches);
  writeHash();
}
function select(id, opts = {}) {
  if (!id) return;
  const changed = id !== state.sel;
  state.sel = id; state.lastSel[state.rule] = id;
  if (changed) state.expr = 0;
  markSel(true);
  if (changed) renderInspector(true);
  if (opts.open && mq.matches) { state.mDetail = true; document.body.classList.add("m-detail"); scrollTo(0, 0); }
  if (opts.focus) { const el = document.querySelector(`#items .item[data-id="${id}"]`); el && el.focus({ preventScroll: true }); }
  writeHash();
}
function setRule(id) {
  if (id === state.rule) return;
  state.rule = id; state.type = state.own = state.mod = null; state.sel = null;
  renderAll(true);
}

let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800);
}
function closePops(except) {
  document.querySelectorAll(".pop.open").forEach(p => { if (p !== except) p.classList.remove("open"); });
  const mb = document.querySelector('[data-act="more"]'); if (mb && (!except || except.id !== "morePop")) mb.setAttribute("aria-expanded", "false");
}

/* events: pane 1 + mobile rule seg + sheet */
document.addEventListener("click", e => {
  const ruleBtn = e.target.closest("[data-rule]");
  if (ruleBtn) { setRule(ruleBtn.dataset.rule); return; }
  const f = e.target.closest(".folder");
  if (f) {
    const g = f.dataset.group, v = f.dataset.value;
    if (g === "all") { state.type = state.own = state.mod = null; }
    else state[g] = state[g] === v ? null : v;
    renderAll(false);
    return;
  }
  const it = e.target.closest("#items .item");
  if (it) { select(it.dataset.id, { open: true }); return; }
  const v = e.target.closest("[data-view]");
  if (v) { state.view = v.dataset.view; renderAll(false); markSel(true); return; }
  const tab = e.target.closest("[data-expr]");
  if (tab) { state.expr = +tab.dataset.expr; renderInspector(false); document.querySelector(`[data-expr="${state.expr}"]`)?.focus(); return; }
  const a = e.target.closest("[data-act]");
  if (a) { act(a.dataset.act, a, e); return; }
  if (!e.target.closest(".pop")) closePops();
});
function act(name, el, e) {
  const c = chars.find(x => x.id === state.sel);
  switch (name) {
    case "clear-q": state.q = ""; renderAll(false); $("#q").focus(); break;
    case "clear-f": state.type = state.own = state.mod = null; renderAll(false); break;
    case "back": state.mDetail = false; document.body.classList.remove("m-detail"); writeHash();
      requestAnimationFrame(() => { const r = document.querySelector(`#items .item[data-id="${state.sel}"]`); r && r.scrollIntoView({ block: "center" }); }); break;
    case "edit": toast(c.owner.kind === "pl" ? `只读打开 ${c.name} 的人物卡` : `打开人物卡编辑器：${c.name}`); break;
    case "portraits": toast(`管理立绘：${c.name}`); break;
    case "more": { const p = $("#morePop"); const open = !p.classList.contains("open"); closePops(); p.classList.toggle("open", open); el.setAttribute("aria-expanded", open); if (open) p.querySelector("button").focus(); e.stopPropagation(); break; }
    case "link": { closePops(); const p = $("#linkPop"); if (p) { p.classList.add("open"); p.querySelector("input")?.focus(); $("#modSect").scrollIntoView({ block: "nearest" }); } e.stopPropagation(); break; }
    case "unlink": c.modules = c.modules.filter(m => m !== el.dataset.mod); c.updatedAt = NOW.toISOString(); toast(`已将 ${c.name} 移出「${el.dataset.mod}」`); refreshAfterEdit(); break;
    case "delete": closePops(); $("#delTitle").textContent = `删除「${c.name}」？`;
      $("#delText").textContent = c.modules.length ? `将同时解除与 ${c.modules.length} 个模组的关联，人物移入回收站。` : "人物将移入回收站。";
      $("#delDlg").showModal(); break;
  }
}
function refreshAfterEdit() {
  renderRules(); renderFolders();
  const keepPop = $("#linkPop")?.classList.contains("open");
  renderResults(); renderInspector(false);
  if (keepPop) $("#linkPop")?.classList.add("open");
  writeHash();
}
document.addEventListener("change", e => {
  const cb = e.target.closest("#linkPop input[type=checkbox]");
  if (cb) {
    const c = chars.find(x => x.id === state.sel), m = cb.dataset.mod;
    if (cb.checked) { if (!c.modules.includes(m)) c.modules.push(m); toast(`已关联「${m}」`); }
    else { c.modules = c.modules.filter(x => x !== m); toast(`已移出「${m}」`); }
    c.updatedAt = NOW.toISOString();
    refreshAfterEdit();
    $(`#linkPop input[data-mod="${CSS.escape(m)}"]`)?.focus();
  }
});
$("#delCancel").onclick = () => $("#delDlg").close();
$("#delOk").onclick = () => {
  const list = results();
  const i = list.findIndex(x => x.id === state.sel);
  const c = list[i];
  chars = chars.filter(x => x.id !== state.sel);
  const next = list[i + 1] || list[i - 1];
  state.sel = next ? next.id : null;
  if (next) state.lastSel[state.rule] = next.id;
  $("#delDlg").close();
  renderAll(true);
  toast(`已删除 ${c.name}`);
};

$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderRules(); renderFolders(); renderResults(); renderInspector(false); writeHash(); });
$("#qClear").onclick = e => { e.preventDefault(); state.q = ""; renderAll(false); $("#q").focus(); };
$("#sort").onchange = e => { state.sort = e.target.value; renderAll(false); markSel(true); };
$("#btnNew").onclick = () => {
  const id = "n" + newSeq;
  const c = { id, ruleId: state.rule, name: "新人物 " + newSeq++, kind: state.type || "PC", owner: { kind: "gm", name: "我" },
    modules: state.mod && state.mod !== "__none" ? [state.mod] : [], portrait: null, expressions: [], updatedAt: NOW.toISOString(), summary: [] };
  if (state.own === "pl") state.own = null;
  state.q = ""; chars.push(c); state.sel = id; state.lastSel[state.rule] = id;
  renderAll(true); markSel(true);
  toast(`已在 ${ruleOf(state.rule).short} 中新建人物`);
};
$("#btnImport").onclick = () => $("#importFile").click();
$("#importFile").onchange = e => { if (e.target.files[0]) toast(`读取 ${e.target.files[0].name}…`); e.target.value = ""; };
$("#btnFilter").onclick = () => { $("#sheet").classList.add("open"); $("#sheetScrim").classList.add("open"); $("#sheet .folder")?.focus(); };
const closeSheet = () => { $("#sheet").classList.remove("open"); $("#sheetScrim").classList.remove("open"); };
$("#sheetDone").onclick = closeSheet;
$("#sheetScrim").onclick = closeSheet;

/* keyboard */
function cols() {
  if (state.view !== "wall") return 1;
  const w = $("#items"); if (!w) return 1;
  return getComputedStyle(w).gridTemplateColumns.split(" ").length;
}
document.addEventListener("keydown", e => {
  const inField = e.target.matches("input,select,textarea");
  if (e.key === "Escape") {
    if (document.querySelector(".pop.open")) { closePops(); return; }
    if ($("#sheet").classList.contains("open")) { closeSheet(); return; }
    if (e.target === $("#q") && state.q) { state.q = ""; renderAll(false); return; }
    if (state.mDetail) { act("back"); return; }
  }
  if (e.key === "/" && !inField) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.target.closest(".pop,[role=tablist],dialog")) return;
  const keys = { ArrowDown: cols(), ArrowUp: -cols(), ArrowRight: state.view === "wall" ? 1 : 0, ArrowLeft: state.view === "wall" ? -1 : 0, j: 1, k: -1 };
  if (inField && e.target !== $("#q")) return;
  if (inField && !["ArrowDown", "ArrowUp"].includes(e.key)) return;
  if (!(e.key in keys) || !keys[e.key]) return;
  if (e.target.closest(".pane-nav,.sheet") && !e.target.closest("#items")) return;
  const list = results(); if (!list.length) return;
  e.preventDefault();
  let i = list.findIndex(c => c.id === state.sel);
  i = Math.max(0, Math.min(list.length - 1, (i < 0 ? 0 : i + keys[e.key])));
  select(list[i].id, { focus: !inField });
});
document.addEventListener("keydown", e => {
  const tab = e.target.closest("[role=tab]");
  if (!tab || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const n = chars.find(x => x.id === state.sel).expressions.length;
  state.expr = (state.expr + (e.key === "ArrowRight" ? 1 : -1) + n) % n;
  renderInspector(false); document.querySelector(`[data-expr="${state.expr}"]`)?.focus();
  e.preventDefault();
});

window.addEventListener("hashchange", () => { const prev = location.hash; readHash(); if (!state.view) state.view = mq.matches ? "list" : "wall"; renderAll(false); });
mq.addEventListener("change", () => document.body.classList.toggle("m-detail", state.mDetail && mq.matches));

readHash();
if (!state.view) state.view = mq.matches ? "list" : "wall";
renderAll(false);
if (!mq.matches) markSel(true, "start");
</script>
</body>
</html>
