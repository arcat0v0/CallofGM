services:
  cogm:
    build:
      context: .
      args:
        COGM_COMMIT: ${COGM_COMMIT:-unknown}
        COGM_BUILD_TIME: ${COGM_BUILD_TIME:-}
    image: cogm:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:15632:15632"
    environment:
      NODE_ENV: production
      VOICE_TURN_REST_SECRET: ${VOICE_TURN_REST_SECRET:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
