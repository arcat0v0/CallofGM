services:
  cogm:
    build:
      context: .
      args:
        COGM_COMMIT: ${COGM_COMMIT:-unknown}
        COGM_BUILD_TIME: ${COGM_BUILD_TIME:-}
    image: cogm:local
    restart: unless-stopped
    ports:
      - "15632:15632"
    environment:
      PORT: "15632"
      NODE_ENV: production
      DATABASE_URL: /app/data/db.sqlite
      MEDIA_DIR: /app/data/media
      THEMES_DIR: /app/data/themes
      VOICE_MAX_PARTICIPANTS: ${VOICE_MAX_PARTICIPANTS:-8}
      VOICE_STUN_URLS: ${VOICE_STUN_URLS:-}
      VOICE_TURN_URLS: ${VOICE_TURN_URLS:-}
      VOICE_TURN_REST_SECRET: ${VOICE_TURN_REST_SECRET:-}
      VOICE_TURN_TTL_SECONDS: ${VOICE_TURN_TTL_SECONDS:-600}
    volumes:
      - ./data:/app/data
