version: 1
generated: "2026-10-31"
sources:
  ccfolia: "https://docs.ccfolia.com/llms-full.txt"
  echo: "https://跑团.cn/"
weight_scale:
  3: "跑团核心体验：骰点鉴定、人物卡、立绘演出、团内状态"
  2: "主要功能：聊天、音频、地图、房间权限、日志"
  1: "便利性功能"
features:
  - id: room-create
    category: room
    name_zh: 创建房间
    source: both
    weight: 2
    detail: 填写房间名与规则/骰点引擎即可开房；回声岛为「预设游戏→房间」两层模型，CCFOLIA 直接建房间
  - id: room-invite-url
    category: room
    name_zh: 邀请链接
    source: both
    weight: 2
    detail: 一键复制房间邀请 URL，打开即进房；回声岛另有独立的观众链接
  - id: room-join-by-id
    category: room
    name_zh: 房间号加入
    source: both
    weight: 2
    detail: CCFOLIA 用房间 ID 在首页输入框进入；回声岛用 10 位字母数字房间号，可粘贴链接自动识别
  - id: room-password
    category: room
    name_zh: 房间密码
    source: echo
    weight: 2
    detail: 房主可设不少于 4 位的密码，玩家凭密码直接进房；与「房主在线审批」二选一
  - id: room-host-approval
    category: room
    name_zh: 房主在线审批入场
    source: echo
    weight: 2
    detail: 未设密码时玩家需等待房主在线同意；有排队态与超时提示
  - id: room-guest-join
    category: room
    name_zh: 免注册游客进房
    source: ccfolia
    weight: 2
    detail: 无账号者通过邀请链接或房间 ID 以游客身份游玩，不可创建房间
  - id: room-permissions
    category: room
    name_zh: 成员权限分级
    source: both
    weight: 2
    detail: CCFOLIA 分房主/副房主/玩家/见学/禁入五档；回声岛分房主/副房主/玩家/观众
  - id: room-sub-gm
    category: room
    name_zh: 副主持人
    source: both
    weight: 2
    detail: 副房主可切场景、改房间设置、用 GM 命令；CCFOLIA 副房主不可管权限与导出房间，回声岛副房主为付费权益
  - id: room-helper-permission
    category: room
    name_zh: 助手权限
    source: echo
    weight: 1
    detail: 房主可授予玩家「助手」，允许其以任意角色身份发言、切换房间资源以辅助演出
  - id: room-kick
    category: room
    name_zh: 踢出玩家
    source: both
    weight: 2
    detail: 将玩家移出房间并取消其自动进房资格，其角色与发言数据保留
  - id: room-spectator
    category: room
    name_zh: 观战席位
    source: both
    weight: 2
    detail: CCFOLIA「見学」可看不可动不可言；回声岛观众经观众链接加入且不计入房间人数
  - id: room-multi-pc
    category: room
    name_zh: 同一房间多角色
    source: echo
    weight: 1
    detail: 同一账号可在同一房间用多张角色卡多次加入
  - id: room-capacity
    category: room
    name_zh: 房间容量与数量限制
    source: both
    weight: 1
    detail: CCFOLIA 当前房间数与人数无硬限；回声岛按用户等级限制房间内人数、活跃房间数与资源配额
  - id: room-reuse-template
    category: room
    name_zh: 房间模板复用
    source: both
    weight: 2
    detail: CCFOLIA 用房间数据 ZIP / 公开链接；回声岛用预设游戏反复开多个房间
  - id: room-recruit
    category: room
    name_zh: 招募玩家
    source: echo
    weight: 1
    detail: 开启后房间进入首页「新团招募」，显示缺口人数，玩家可评论或私信联系
  - id: room-sleep
    category: room
    name_zh: 房间休眠与唤醒
    source: echo
    weight: 1
    detail: 长期未启动自动休眠且不占配额，唤醒需房主确认
  - id: room-maintenance-mode
    category: room
    name_zh: 布场模式
    source: ccfolia
    weight: 2
    detail: 「工事中モード」开启后玩家及以下权限无法进房，GM 可先布置场景再放人
  - id: room-public-distribution
    category: room
    name_zh: 房间数据公开分发
    source: both
    weight: 1
    detail: CCFOLIA 公开链接可一键生成同配置新房（PRO）；回声岛公开房间可被他人查看 Log 与复用预设游戏
  - id: room-metadata
    category: room
    name_zh: 房间公开信息
    source: both
    weight: 1
    detail: 房间标题、简介、封面、公开/私密标记、模组来源说明
  - id: room-delete-archive
    category: room
    name_zh: 删除与结团归档
    source: both
    weight: 2
    detail: 删除不可恢复；结团可归档为 Replay 或纯文字 Log 并终止房间
  - id: map-foreground-background
    category: map
    name_zh: 前景与背景图
    source: both
    weight: 2
    detail: CCFOLIA 前景限网格区域、背景铺满整屏，可叠透明图做动效；回声岛场景图即背景
  - id: map-grid
    category: map
    name_zh: 网格
    source: both
    weight: 2
    detail: 可开关、可调格距与颜色；CCFOLIA 支持前景上显示网格，回声岛支持方形与六边形
  - id: map-token-drag
    category: map
    name_zh: 棋子拖动
    source: both
    weight: 2
    detail: 拖拽移动棋子/面板；CCFOLIA 默认网格吸附，回声岛角色节点可开「棋子模式」
  - id: map-token-size
    category: map
    name_zh: 棋子尺寸
    source: both
    weight: 2
    detail: CCFOLIA 以格为单位设长边（上限 30 格）；回声岛按节点宽高与缩放
  - id: map-token-layer
    category: map
    name_zh: 层级与置顶
    source: both
    weight: 2
    detail: CCFOLIA 面板有重なり優先度可含负值；回声岛为显式图层（上移/置顶/置底/分组）
  - id: map-panel-free-layout
    category: map
    name_zh: 自由摆放
    source: both
    weight: 1
    detail: 关闭网格吸附做像素级摆放；CCFOLIA 为房间级开关，回声岛为自由画布模式
  - id: map-panel-fixed
    category: map
    name_zh: 位置与尺寸固定
    source: both
    weight: 1
    detail: 固定面板防止玩家误拖；回声岛另有节点锁定
  - id: map-marker-panel
    category: map
    name_zh: 场景标记层
    source: ccfolia
    weight: 1
    detail: マーカーパネル仅当前场景显示，用于地图图标与战斗装饰；切场景即消失
  - id: map-panel-flip-private
    category: map
    name_zh: 卡片翻面与私看
    source: ccfolia
    weight: 2
    detail: 面板可全体公开/仅自己看/非公开/仅自己以外可见；私看时背面显示查看者名字
  - id: map-click-action
    category: map
    name_zh: 面板点击动作
    source: ccfolia
    weight: 1
    detail: 点击面板即向当前聊天标签发送预设文本，可做成掷骰按钮、切场景按钮、开 PDF 按钮
  - id: map-panel-hide
    category: map
    name_zh: 面板显示与隐藏
    source: ccfolia
    weight: 1
    detail: 面板可整体隐藏，用于「找到后才公开地图」的桥段
  - id: map-fog
    category: map
    name_zh: 战争迷雾
    source: echo
    weight: 2
    detail: 沙盒战斗地图支持笔刷绘制/擦除迷雾、迷雾颜色与不透明度、迷雾透视
  - id: map-lighting
    category: map
    name_zh: 动态光照
    source: echo
    weight: 1
    detail: 固定光源与跟随光源、光色/强度/半径、火把脉冲闪烁、环境黑暗
  - id: map-ruler
    category: map
    name_zh: 测距
    source: echo
    weight: 1
    detail: 线段多次点击测距与圆形半径测距，可设单位格距（如 5 尺）
  - id: map-aoe-template
    category: map
    name_zh: 范围模板
    source: echo
    weight: 2
    detail: 圆/锥/线/矩形范围指示器，可常显尺寸、可拖拽移动，与物品施法范围联动选目标
  - id: map-token-ownership
    category: map
    name_zh: 棋子所有权
    source: both
    weight: 2
    detail: CCFOLIA 可「自分のものにする」夺取；回声岛角色节点绑定角色卡归属
  - id: map-token-status
    category: map
    name_zh: 棋子状态显示
    source: both
    weight: 3
    detail: 角色一览显示 HP 等状态条与先攻，低于上限 80% 变红；状态可对他人隐藏
  - id: map-token-hide
    category: map
    name_zh: 棋子收起与再放回
    source: both
    weight: 1
    detail: CCFOLIA「しまう」后再「盤面に追加」回原位；回声岛可隐藏节点
  - id: map-undo-redo
    category: map
    name_zh: 盘面撤销重做
    source: ccfolia
    weight: 1
    detail: Ctrl+Z / Ctrl+Y 回退盘面操作，含场景切换
  - id: map-multi-select
    category: map
    name_zh: 多选移动删除
    source: both
    weight: 1
    detail: Shift 点选/框选后批量移动或删除；CCFOLIA v1.35 加入，回声岛沙盒原生多选
  - id: map-token-copy
    category: map
    name_zh: 棋子跨房间复制
    source: ccfolia
    weight: 1
    detail: 右键复制或 Ctrl+C/V，把角色棋子连同属性与立绘带到其他房间
  - id: map-3d-parallax
    category: map
    name_zh: 3D 视差场景
    source: echo
    weight: 1
    detail: 单张场景图经深度估计生成视差场景，低配设备可禁用
  - id: map-custom-ui
    category: map
    name_zh: 自定义 UI 沙盒
    source: echo
    weight: 2
    detail: 类 PPT 节点系统可搭出地图、HUD、商店、计分板等任意界面，可绑定场景或作遮罩
  - id: portrait-multi-diff
    category: portrait
    name_zh: 多表情差分
    source: both
    weight: 3
    detail: 一张角色卡挂多张差分立绘；CCFOLIA 以标签命名，回声岛按差分名管理并受等级配额
  - id: portrait-switch-via-chat
    category: portrait
    name_zh: 发言时切换差分
    source: both
    weight: 3
    detail: CCFOLIA 发差分标签即切图；回声岛用 %角色%差分%台词 三段语法，发言同时唤起立绘
  - id: portrait-auto-diff-on-roll
    category: portrait
    name_zh: 骰点结果自动切表情
    source: ccfolia
    weight: 3
    detail: 把成功/失败/大失败设为差分标签，骰点末尾命中即自动换表情，多标签取最长
  - id: portrait-triple-mode
    category: portrait
    name_zh: 头像/小立绘/大立绘三态
    source: echo
    weight: 3
    detail: 三种形态各有独立位置、缩放、翻转，可一键应用到所有差分或所有角色
  - id: portrait-position-scale
    category: portrait
    name_zh: 立绘位置与缩放微调
    source: echo
    weight: 3
    detail: 拖动与缩放矫正立绘，支持逐差分与批量套用，并锁定左右排布顺序
  - id: portrait-entrance-animation
    category: portrait
    name_zh: 立绘动画
    source: echo
    weight: 2
    detail: 差分出场可配呼吸、漂浮、震动、失焦等动画，支持多段叠加、强度与循环
  - id: portrait-border-float
    category: portrait
    name_zh: 悬浮立绘边框
    source: echo
    weight: 1
    detail: 非透明背景立绘可加边框并悬浮于画面上层，避免视觉割裂
  - id: portrait-alias
    category: portrait
    name_zh: 角色假名
    source: echo
    weight: 2
    detail: 真实名之外设置对外显示的假名，用于隐藏身份或避免剧透
  - id: portrait-tts
    category: portrait
    name_zh: 角色语音朗读
    source: echo
    weight: 2
    detail: 角色绑定音色，发言与回放时朗读；支持预设音色、自建音色、多情绪
  - id: portrait-batch-face-crop
    category: portrait
    name_zh: 差分批量裁切
    source: echo
    weight: 1
    detail: 一次上传最多 50 张同构图，自动检测脸部差异区并批量裁切，可手动框选
  - id: portrait-art-command
    category: portrait
    name_zh: 立绘开关指令
    source: echo
    weight: 1
    detail: 用 /art 指令开关立绘；每频道可设最大立绘数量
  - id: char-sheet
    category: character
    name_zh: 角色卡
    source: both
    weight: 3
    detail: 姓名、头像、属性、技能、备注、补充信息；回声岛支持数值/文本/公式/骰子表达式四种属性
  - id: char-derived-formula
    category: character
    name_zh: 派生属性公式
    source: echo
    weight: 3
    detail: 取值与上限可用公式（如 floor((体质+体型)/10)），带循环引用与依赖深度检测
  - id: char-status-bar
    category: character
    name_zh: 状态栏与数值条
    source: both
    weight: 3
    detail: 当前值/上限、进度条、颜色标记；低于 80% 高亮，可置顶显示
  - id: char-quick-dice
    category: character
    name_zh: 角色快捷键掷骰
    source: both
    weight: 2
    detail: 角色卡内预存掷骰表达式（武器伤害等）随时投掷
  - id: char-palette
    category: character
    name_zh: 聊天面板命令集
    source: ccfolia
    weight: 3
    detail: chat palette 换行即分条，浮窗一键发送台词或骰点命令，输入片段可模糊补全
  - id: char-command-import
    category: character
    name_zh: 属性批量导入
    source: echo
    weight: 2
    detail: .st 侦查60 形式批量设置属性，支持从自动角色卡 Excel 文本粘贴，可过滤重复技能名
  - id: char-template-creator
    category: character
    name_zh: 车卡模板与创建器
    source: echo
    weight: 3
    detail: 内嵌 HTML 或外部 URL 创建器，postMessage 回传角色数据，支持数据文件与分步表单
  - id: char-review
    category: character
    name_zh: 审卡流程
    source: echo
    weight: 2
    detail: 创建结果有未审核/待审核/已通过/已拒绝，可生成只读审卡链接交给主持人
  - id: char-npc-library
    category: character
    name_zh: 公开 NPC 库
    source: echo
    weight: 1
    detail: 常用怪物/NPC 整卡可提交到公开库，同规则用户一键加入房间
  - id: char-visibility
    category: character
    name_zh: 角色可见性
    source: both
    weight: 3
    detail: CCFOLIA 可隐藏状态、先攻与编辑页；回声岛可设哪些玩家能看角色卡，默认仅主持人可见
  - id: char-owner-claim
    category: character
    name_zh: 角色认领与所有权
    source: both
    weight: 3
    detail: 玩家认领/夺取角色；CCFOLIA 可「自分のものにする」，回声岛玩家角色名锁定后不可代改
  - id: char-name-lock
    category: character
    name_zh: 开团后改名限制
    source: echo
    weight: 2
    detail: 角色名关系消息归属与回放身份，开团后不可改，仅可用假名调整对外显示
  - id: char-memo
    category: character
    name_zh: 角色备注
    source: ccfolia
    weight: 1
    detail: 悬停棋子显示补充信息；面板亦可设悬停备注
  - id: char-room-variables
    category: character
    name_zh: 房间变量
    source: ccfolia
    weight: 2
    detail: 最多 16 个键值（标签≤16 字、值≤64 字），聊天中 {标签} 取用，/var 增删改
  - id: char-clipboard-api
    category: character
    name_zh: 剪贴板粘贴角色
    source: ccfolia
    weight: 1
    detail: 以 JSON 字符串粘贴整只角色（名称、属性、差分、位置等）
  - id: dice-expression
    category: dice
    name_zh: 骰点表达式
    source: both
    weight: 3
    detail: XdY±Z 与四则运算、连投、取高取低；CCFOLIA 走 BCDice 语法，回声岛为自有表达式
  - id: dice-multi-system-bot
    category: dice
    name_zh: 多规则骰点引擎
    source: ccfolia
    weight: 3
    detail: 基于 BCDice，建房时选规则，官方称支持 200 种以上系统
  - id: dice-coc7-skill-check
    category: dice
    name_zh: CoC 7e 技能检定
    source: both
    weight: 3
    detail: 读角色技能值掷 d100 并判大成功/极难/困难/成功/失败/大失败；CCFOLIA 为 CC<=目标值
  - id: dice-bonus-penalty
    category: dice
    name_zh: 奖励骰与惩罚骰
    source: both
    weight: 3
    detail: 多掷十位骰取优/劣；CCFOLIA 写 CC(2)/CC-2，回声岛写 b1/p2
  - id: dice-difficulty-level
    category: dice
    name_zh: 难度等级
    source: both
    weight: 3
    detail: CCFOLIA 目标值后缀 r/h/e/c；回声岛 .ra 支持普通/困难/极难与规则参数档位
  - id: dice-coc6-ccb
    category: dice
    name_zh: CoC 6 版 CCB 骰
    source: ccfolia
    weight: 2
    detail: 6 版骰点 bot 的 CCB 采用 5% 规则（c=5%/f=96%），另有 RES 抵抗表；非 7 版命令
  - id: dice-san-check
    category: dice
    name_zh: 理智检定
    source: echo
    weight: 3
    detail: .sc 1/1d6 对当前 SAN 掷骰，自动掷损失并写回；CCFOLIA 只能把 SAN 当普通目标值手算
  - id: dice-growth-check
    category: dice
    name_zh: 成长检定
    source: echo
    weight: 3
    detail: .en 侦查 掷 d100 高于技能值即成长，默认加 1d10 并自动写回；CCFOLIA 无此命令
  - id: dice-opposed-check
    category: dice
    name_zh: 对抗检定
    source: echo
    weight: 3
    detail: 与对方已出成功等级比较给出较高/同级/较低，供闪避、反击类规则调用
  - id: dice-autofire
    category: dice
    name_zh: 自动武器连发
    source: both
    weight: 2
    detail: CCFOLIA FAR 命令结算命中/贯穿/残弹；回声岛 .burst 按组叠惩罚骰、超额转难度升级
  - id: dice-roll-table
    category: dice
    name_zh: 原创随机表
    source: both
    weight: 2
    detail: CCFOLIA /roll-table 现场定义表；回声岛 /draw 抽规则表与变量表，/q 私查规则数据
  - id: dice-secret-roll
    category: dice
    name_zh: 暗骰
    source: both
    weight: 3
    detail: 结果仅自己（回声岛另含主持人）可见；CCFOLIA 前缀 s，回声岛后缀 h（.rh/.rah）
  - id: dice-3d-animation
    category: dice
    name_zh: 3D 骰子动画
    source: both
    weight: 1
