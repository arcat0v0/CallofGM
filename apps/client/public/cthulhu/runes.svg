<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" fill="none" stroke="currentColor" role="img" aria-label="原创符文">
  <!-- 三枚原创符文（几何绘制，无版权素材），作分隔花纹与装饰。
       以 <symbol> 供 <use href="#rune-tide"> 等方式单独引用。
       颜色 currentColor。 -->
  <defs>
    <!-- 潮汐：圆环内三道波浪线 -->
    <symbol id="rune-tide" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="26"/>
      <path d="M12 24 Q18 18 24 24 T36 24 T48 24" stroke-width="2"/>
      <path d="M12 32 Q18 26 24 32 T36 32 T48 32" stroke-width="2"/>
      <path d="M12 40 Q18 34 24 40 T36 40 T48 40" stroke-width="2"/>
    </symbol>
    <!-- 门扉：拱门 + 门内圆点 + 基线 -->
    <symbol id="rune-gate" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="26"/>
      <path d="M18 46 L18 28 Q18 14 30 14 Q42 14 42 28 L42 46" stroke-width="2"/>
      <line x1="12" y1="46" x2="48" y2="46" stroke-width="2"/>
      <circle cx="30" cy="30" r="4" fill="currentColor" stroke="none"/>
    </symbol>
    <!-- 星芒：八角星芒 + 中心圆 -->
    <symbol id="rune-star" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="26"/>
      <path d="M30 10 L30 50 M10 30 L50 30 M16 16 L44 44 M44 16 L16 44" stroke-width="2"/>
      <circle cx="30" cy="30" r="5"/>
    </symbol>
  </defs>
  <use href="#rune-tide" x="0" y="0" width="60" height="60"/>
  <use href="#rune-gate" x="60" y="0" width="60" height="60"/>
  <use href="#rune-star" x="120" y="0" width="60" height="60"/>
</svg>
