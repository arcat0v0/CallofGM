<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 64" fill="none" stroke="currentColor" role="img" aria-label="大失败印章">
  <!-- 成品印章：大失败。与失败同为红印泥（纸面加深红 #8e1f2a），靠文字区分。 -->
  <defs>
    <mask id="ink-wear">
      <rect x="0" y="0" width="120" height="64" fill="#fff"/>
      <g stroke="#000" stroke-width="1.4" opacity="0.55">
        <line x1="20" y1="0" x2="12" y2="64"/>
        <line x1="66" y1="0" x2="60" y2="64"/>
        <line x1="104" y1="0" x2="98" y2="64"/>
      </g>
      <g fill="#000" opacity="0.5">
        <circle cx="40" cy="10" r="1.6"/>
        <circle cx="78" cy="52" r="1.8"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#ink-wear)">
    <rect x="2" y="2" width="116" height="60" rx="6" stroke-width="3"/>
    <rect x="7" y="7" width="106" height="50" rx="4" stroke-width="1"/>
    <text x="60" y="32" text-anchor="middle" font-family="Georgia, 'Songti SC', 'STSong', serif" font-size="19" font-weight="700" letter-spacing="2" fill="currentColor" stroke="none">大失败</text>
    <text x="60" y="50" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8" letter-spacing="3" fill="currentColor" stroke="none">FUMBLE</text>
  </g>
</svg>
