<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 16" fill="none" stroke="currentColor" role="img" aria-label="分隔纹样">
  <!-- 章回分隔行 / 标题两侧细线纹样：细线向两端渐隐，中央菱形 + 两侧小点。
       颜色 currentColor；横向拉伸使用（preserveAspectRatio="none" 可拉满宽度）。 -->
  <defs>
    <linearGradient id="fade-l" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="138" y2="8">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fade-r" gradientUnits="userSpaceOnUse" x1="182" y1="8" x2="320" y2="8">
      <stop offset="0%" stop-color="currentColor" stop-opacity="1"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="8" x2="138" y2="8" stroke="url(#fade-l)" stroke-width="1"/>
  <line x1="182" y1="8" x2="320" y2="8" stroke="url(#fade-r)" stroke-width="1"/>
  <circle cx="146" cy="8" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="174" cy="8" r="1.6" fill="currentColor" stroke="none"/>
  <path d="M160 2 L166 8 L160 14 L154 8 Z" fill="currentColor" stroke="none"/>
</svg>
