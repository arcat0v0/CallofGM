<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 64" fill="none" stroke="currentColor" role="img" aria-label="印章双线框">
  <!-- 双线印章框（无字版）：文字由 JSX 以衬线体渲染，便于 i18n。
       做旧效果由调用处 CSS mask（repeating-linear-gradient 115deg）实现，
       或叠加 ink-grunge.svg 作遮罩。颜色 currentColor。 -->
  <defs>
    <mask id="ink-wear">
      <rect x="0" y="0" width="120" height="64" fill="#fff"/>
      <!-- 不均匀的印泥缺口：少量斜向细白纹 -->
      <g stroke="#000" stroke-width="1.4" opacity="0.55">
        <line x1="18" y1="0" x2="10" y2="64"/>
        <line x1="46" y1="0" x2="40" y2="64"/>
        <line x1="88" y1="0" x2="80" y2="64"/>
        <line x1="108" y1="0" x2="102" y2="64"/>
      </g>
      <g fill="#000" opacity="0.5">
        <circle cx="30" cy="12" r="1.6"/>
        <circle cx="72" cy="50" r="1.8"/>
        <circle cx="98" cy="20" r="1.3"/>
        <circle cx="12" cy="44" r="1.4"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#ink-wear)">
    <rect x="2" y="2" width="116" height="60" rx="6" stroke-width="3"/>
    <rect x="7" y="7" width="106" height="50" rx="4" stroke-width="1"/>
  </g>
</svg>
